[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
authors = ["Lager Data"]
description = "Background daemon for oscilloscope control and data streaming"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.18"
protocol = { path = "../protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# CLOCK_MONOTONIC, so capture timestamps share an epoch with clients that
# read time.monotonic_ns(). A process-relative Instant would make
# cross-process latency meaningless.
libc = "0.2"

# dlopen the PicoTech drivers at runtime, so one binary serves any installed
# series and the build needs no SDK.
libloading = "0.8"

# WebSocket. One transport: see the module docs in src/server.rs for why the
# WebTransport/QUIC listeners were removed rather than kept alongside.
tokio-tungstenite = "0.30"
tungstenite = "0.30"
futures-util = "0.3"

[build-dependencies]
bindgen = "0.72"
cc = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "lscp_encode"
harness = false

[features]
default = ["ps2000"]
ps2000 = []