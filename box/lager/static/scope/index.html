<!DOCTYPE html>
<!--
  Copyright 2024-2026 Lager Data
  SPDX-License-Identifier: Apache-2.0

  Lager scope UI. Served by box_http_server at GET /scope on :9000, the same
  port every other net uses. No build step and no dependencies: plain ES
  modules and a 2D canvas, so the page works on a box with no internet access
  and there is nothing to rebuild when it changes.

  Controls are built from the scope's detected capabilities rather than
  hardcoded, so a 2-channel 2204A shows two channels and a 4-channel unit
  shows four, without a UI change.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lager Scope</title>
  <link rel="stylesheet" href="/scope/static/scope.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo">Lager</span>
      <span class="sub">Scope</span>
    </div>

    <label class="field">
      <span>Net</span>
      <select id="net-select" aria-label="Scope net"></select>
    </label>

    <div class="ident">
      <span id="model" class="model">&mdash;</span>
      <span id="serial" class="serial"></span>
    </div>

    <div class="spacer"></div>

    <div class="stats" role="status" aria-live="off">
      <span id="stat-rate">0 cap/s</span>
      <span id="stat-rate-samples">&mdash;</span>
      <span id="stat-latency">&mdash;</span>
    </div>

    <!-- What the last frame drawn was: triggered, auto-triggered, rolling, or
         stopped. A bench scope shows this in the corner of its screen; it is
         the first thing to look at when a trace will not hold still. -->
    <span id="trig-status" class="trig trig--stop" role="status">STOP</span>
    <span id="link" class="link link--down">disconnected</span>
    <button id="connect" class="btn btn--primary" type="button">Connect</button>
  </header>

  <main class="layout">
    <section class="plot" aria-label="Waveform">
      <canvas id="scope-canvas"></canvas>
      <div id="plot-empty" class="plot-empty">
        <p>Not streaming.</p>
        <p class="dim">Press <strong>Connect</strong>, then <strong>Start</strong>.</p>
      </div>
      <div id="overflow-warning" class="overflow-warning" hidden></div>
    </section>

    <aside class="controls" aria-label="Controls">
      <div class="group">
        <div class="group__title">Acquisition</div>
        <div class="row">
          <button id="btn-start" class="btn" type="button">Start</button>
          <button id="btn-single" class="btn" type="button">Single</button>
          <button id="btn-stop" class="btn" type="button">Stop</button>
        </div>
        <div class="row">
          <button id="btn-force" class="btn btn--wide" type="button">Force trigger</button>
        </div>
        <label class="field field--stack">
          <span>Time / div</span>
          <select id="timebase"></select>
        </label>
        <!-- Moves the capture window earlier or later than the trigger, to
             bring signal that sits off the left or right edge into view.
             Divisions rather than seconds so it reads against the grid. One
             screen of travel each way is the whole of it: at -5 the trigger
             sits on the right edge and the screen is all pre-trigger, at +5
             it sits on the left and the screen is all post-trigger. Not a
             label, because it holds two controls. -->
        <div class="field field--stack">
          <span>Position (div)</span>
          <div class="field-row">
            <input id="time-position" type="number" step="0.5" min="-5" max="5"
                   value="0" aria-label="Horizontal position in divisions">
            <button id="time-position-reset" class="btn btn--small" type="button"
                    title="Centre the trigger">0</button>
          </div>
        </div>
        <!-- How consecutive captures combine. The count only applies to
             average. Peak detect is offered disabled on a unit that cannot
             do it, with the reason in its title. -->
        <div class="field field--stack">
          <span>Acquire</span>
          <div class="field-row">
            <select id="acquire-mode" aria-label="Acquisition mode">
              <option value="normal">Normal</option>
              <option value="average">Average</option>
              <option value="peak">Peak detect</option>
            </select>
            <input id="acquire-count" type="number" min="1" max="1024" step="1"
                   value="16" aria-label="Captures to average" title="Captures to average">
          </div>
        </div>
        <label id="roll-field" class="field field--stack">
          <span>Roll</span>
          <select id="roll-mode">
            <option value="auto">Auto (50 ms/div and slower)</option>
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
        </label>
      </div>

      <div class="group">
        <div class="group__title">Channels</div>
        <!-- Populated from capabilities.analog_channels. -->
        <div id="channels"></div>
      </div>

      <div class="group">
        <div class="group__title">Trigger</div>
        <label class="field field--stack">
          <span>Source</span>
          <select id="trigger-source"></select>
        </label>
        <label class="field field--stack">
          <span>Slope</span>
          <select id="trigger-slope">
            <option value="rising">Rising</option>
            <option value="falling">Falling</option>
            <option value="either">Either</option>
          </select>
        </label>
        <label class="field field--stack">
          <span>Mode</span>
          <select id="trigger-mode">
            <option value="auto">Auto</option>
            <option value="normal">Normal</option>
            <option value="single">Single</option>
          </select>
        </label>
        <label class="field field--stack">
          <span>Level (V)</span>
          <input id="trigger-level" type="number" step="0.01" value="0">
        </label>
        <label class="field field--stack">
          <span>Holdoff (s)</span>
          <input id="trigger-holdoff" type="number" step="any" min="0" max="10" value="0">
        </label>
        <!-- On by default: a trigger level you cannot see is one you cannot
             set with any confidence. Off for a crowded screen, or to read a
             trace the markers cross. -->
        <label class="field field--inline">
          <input id="trigger-markers" type="checkbox" checked>
          <span>Show trigger markers</span>
        </label>
      </div>

      <!-- How the trace is drawn. Held on the box, like the cursors, so the
           terminal CLI can set these and this page follows. -->
      <div class="group">
        <div class="group__title">Display</div>
        <label class="field field--stack">
          <span>Persistence</span>
          <select id="display-persistence">
            <option value="off">Off</option>
            <option value="0.5">0.5 s</option>
            <option value="1">1 s</option>
            <option value="2">2 s</option>
            <option value="5">5 s</option>
            <option value="infinite">Infinite</option>
          </select>
        </label>
        <div class="field field--stack">
          <span>Zoom &times; / centre (s)</span>
          <div class="field-row">
            <input id="display-zoom" type="number" min="1" max="1000" step="any"
                   value="1" aria-label="Zoom factor">
            <input id="display-zoom-center" type="number" step="any" value="0"
                   aria-label="Zoom centre, seconds from the trigger"
                   title="Seconds from the trigger">
          </div>
        </div>
        <label class="field field--stack">
          <span>Math</span>
          <select id="display-math">
            <option value="off">Off</option>
            <option value="A+B">A + B</option>
            <option value="A-B">A &minus; B</option>
            <option value="B-A">B &minus; A</option>
            <option value="A*B">A &times; B</option>
          </select>
        </label>
        <label class="field field--stack">
          <span>FFT</span>
          <select id="display-fft">
            <option value="off">Off</option>
          </select>
        </label>
        <label class="field field--inline">
          <input id="display-xy" type="checkbox">
          <span>XY (B against A)</span>
        </label>
      </div>

      <div class="group">
        <div class="group__title">Measurements</div>
        <div id="measurements" class="measurements">
          <p class="dim">Start a capture to see measurements.</p>
        </div>
      </div>

      <div id="capability-notes" class="group group--notes" hidden>
        <div class="group__title">This scope</div>
        <ul id="capability-list"></ul>
      </div>
    </aside>
  </main>

  <section class="console" aria-label="Command console">
    <div class="console__bar">
      <span class="console__title">CLI</span>
      <span class="dim">same commands as <code>lager scope</code> &mdash; type
        <code>help</code></span>
      <div class="spacer"></div>
      <button id="btn-clear" class="btn btn--small" type="button">Clear</button>
    </div>
    <div id="console-output" class="console__output" role="log" aria-live="polite"></div>
    <form id="console-form" class="console__input" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="console-line" type="text" spellcheck="false"
             aria-label="Command" placeholder="help">
    </form>
  </section>

  <script type="module" src="/scope/static/scope.js"></script>
</body>
</html>
