<!DOCTYPE html>
<!--
  Copyright 2024-2026 Lager Data
  SPDX-License-Identifier: Apache-2.0

  Lager webcam viewer. Served by each webcam stream's own HTTP server
  (lager/automation/webcam/service.py) at GET / on the stream's port, with
  its assets under /static/. Laid out and styled like the scope UI
  (lager/static/scope/) so the two read as one product: a header bar, the
  picture, and a controls sidebar that can be hidden.

  No build step and no dependencies, so it works on a box with no internet
  access. Everything it shows comes from the stream's /api/* endpoints.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lager Webcam</title>
  <link rel="stylesheet" href="/static/webcam.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo">Lager</span>
      <span class="sub">Webcam</span>
    </div>

    <label class="field">
      <span>Net</span>
      <select id="net-select" aria-label="Webcam net"></select>
    </label>

    <div class="ident">
      <span id="model" class="model">&mdash;</span>
      <span id="device" class="serial"></span>
    </div>

    <div class="spacer"></div>

    <div class="stats" role="status" aria-live="off">
      <span id="stat-fps">&mdash; fps</span>
      <span id="stat-size">&mdash;</span>
      <span id="stat-zoom">1.0&times;</span>
    </div>

    <!-- Whether frames are arriving: LIVE, STALLED (the camera stopped
         delivering) or OFFLINE (the stream's server does not answer). -->
    <span id="live" class="live live--off" role="status">OFFLINE</span>
    <button id="btn-sidebar" class="btn btn--small" type="button"
            aria-expanded="true" aria-controls="webcam-controls"
            title="Hide the controls sidebar">Hide sidebar</button>
    <!-- Before the sidebar is parsed, so a remembered "hidden" does not flash
         on screen. The key and the class are SIDEBAR_STORAGE_KEY and
         SIDEBAR_HIDDEN_CLASS in webcam.js. -->
    <script>
      try {
        if (localStorage.getItem('lager-webcam-sidebar') === 'hidden') {
          document.documentElement.classList.add('is-sidebar-hidden');
          var sidebarButton = document.getElementById('btn-sidebar');
          sidebarButton.setAttribute('aria-expanded', 'false');
          sidebarButton.textContent = 'Show sidebar';
          sidebarButton.title = 'Show the controls sidebar';
        }
      } catch (e) { /* storage blocked: the sidebar stays shown */ }
    </script>
    <button id="btn-fullscreen" class="btn btn--small" type="button"
            title="Show the picture full screen">Full screen</button>
    <a id="btn-snapshot" class="btn btn--primary" href="/snapshot"
       download="snapshot.jpg">Snapshot</a>
  </header>

  <main class="layout">
    <section id="feed-section" class="feed" aria-label="Live feed">
      <!-- Focusable so the arrow keys can pan it. Drag to pan when zoomed in;
           double-click to zoom in on a point, or to centre on it. -->
      <div id="frame" class="frame" tabindex="0"
           aria-label="Live picture. When zoomed in, drag or use the arrow keys to pan.">
        <img id="feed" alt="Live webcam feed">
        <span id="clock" class="chip chip--clock" hidden></span>
        <span id="zoom-chip" class="chip chip--zoom" hidden></span>
      </div>
      <div id="feed-empty" class="feed-empty">
        <p id="feed-empty-title">Connecting&hellip;</p>
        <p class="dim" id="feed-empty-hint"></p>
      </div>
    </section>

    <aside id="webcam-controls" class="controls" aria-label="Controls">
      <div class="group">
        <div class="group__title">Resolution</div>
        <div class="pair">
          <label class="field field--stack" for="mode-size">
            <span>Size</span>
            <select id="mode-size"></select>
          </label>
          <label class="field field--stack" for="mode-fps">
            <span>Frame rate</span>
            <select id="mode-fps"></select>
          </label>
        </div>
        <p id="mode-note" class="note" hidden></p>
      </div>

      <div class="group">
        <div class="group__title">View</div>
        <label class="field field--stack" for="zoom">
          <span class="field__head"><span>Zoom</span><output id="zoom-value" for="zoom">1.0&times;</output></span>
          <input id="zoom" type="range" min="1" max="4" step="0.1" value="1">
        </label>
        <div class="row">
          <button id="zoom-out" class="btn" type="button">Out</button>
          <button id="zoom-reset" class="btn" type="button">Reset</button>
          <button id="zoom-in" class="btn" type="button">In</button>
        </div>
        <div class="row row--note">
          <span class="dim" id="pan-hint">Zoom in, then drag the picture to pan.</span>
          <button id="pan-centre" class="btn btn--small" type="button" disabled>Centre</button>
        </div>
        <div class="pair">
          <label class="field field--stack" for="rotate">
            <span>Rotate</span>
            <select id="rotate">
              <option value="0">0&deg;</option>
              <option value="90">90&deg;</option>
              <option value="180">180&deg;</option>
              <option value="270">270&deg;</option>
            </select>
          </label>
          <div class="field field--stack">
            <span>Flip</span>
            <div class="segmented segmented--loose" role="group" aria-label="Flip">
              <button id="flip-h" class="segmented__btn" type="button" aria-pressed="false"
                      aria-label="Flip horizontally" title="Mirror left to right">&harr;</button>
              <button id="flip-v" class="segmented__btn" type="button" aria-pressed="false"
                      aria-label="Flip vertically" title="Mirror top to bottom">&varr;</button>
            </div>
          </div>
        </div>
      </div>

      <div id="focus-group" class="group">
        <div class="group__title">Focus</div>
        <div id="focus-mode" class="segmented" role="group" aria-label="Focus mode">
          <button id="focus-auto" class="segmented__btn" type="button" aria-pressed="true">Auto</button>
          <button id="focus-manual" class="segmented__btn" type="button" aria-pressed="false">Manual</button>
        </div>
        <label class="field field--stack" for="focus">
          <span class="field__head"><span>Distance</span><output id="focus-value" for="focus">auto</output></span>
          <input id="focus" type="range" min="0" max="1023" step="1" value="0" disabled>
        </label>
      </div>

      <div class="group">
        <div class="group__title">Image</div>
        <div id="exposure-group" hidden>
          <div id="exposure-mode" class="segmented" role="group" aria-label="Exposure mode">
            <button id="exposure-auto" class="segmented__btn" type="button" aria-pressed="true">Auto exposure</button>
            <button id="exposure-manual" class="segmented__btn" type="button" aria-pressed="false">Manual</button>
          </div>
          <label class="field field--stack" for="exposure">
            <span class="field__head"><span>Exposure</span><output id="exposure-value" for="exposure">auto</output></span>
            <input id="exposure" type="range" min="0" max="100" step="1" value="50">
          </label>
        </div>
        <label id="gain-group" class="field field--stack" for="gain" hidden>
          <span class="field__head"><span>Gain</span><output id="gain-value" for="gain">0</output></span>
          <input id="gain" type="range" min="0" max="100" step="1" value="0">
        </label>
        <label id="brightness-group" class="field field--stack" for="brightness">
          <span class="field__head"><span>Brightness</span><output id="brightness-value" for="brightness">0</output></span>
          <input id="brightness" type="range" min="0" max="255" step="1" value="0">
        </label>
        <div id="wb-group" hidden>
          <div id="wb-mode" class="segmented" role="group" aria-label="White balance mode">
            <button id="wb-auto" class="segmented__btn" type="button" aria-pressed="true">Auto white balance</button>
            <button id="wb-manual" class="segmented__btn" type="button" aria-pressed="false">Manual</button>
          </div>
          <label class="field field--stack" for="wb">
            <span class="field__head"><span>Color temperature</span><output id="wb-value" for="wb">auto</output></span>
            <input id="wb" type="range" min="2800" max="6500" step="1" value="4600">
          </label>
        </div>
        <!-- Contrast, saturation, hue, gamma, sharpness and backlight
             compensation: one slider each, for whichever the camera has. -->
        <div id="image-adjust"></div>
        <label id="power-line-group" class="field field--stack" for="power-line" hidden>
          <span>Power line frequency</span>
          <select id="power-line"></select>
        </label>
      </div>

      <dl class="about">
        <dt>Started</dt><dd id="about-started">&mdash;</dd>
        <dt>Device</dt><dd id="about-device">&mdash;</dd>
        <dt>Port</dt><dd id="about-port">&mdash;</dd>
      </dl>
    </aside>
  </main>

  <script src="/static/webcam.js"></script>
</body>
</html>
