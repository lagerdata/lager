#
# Until now there was no dependabot.yml, so the security tab produced ALERTS
# but nothing produced fix PRs -- advisory 13 (quinn-proto, high, runtime) sat
# open and untouched because closing it required someone to notice the tab.
#
# Everything is grouped. Ungrouped, the pip and actions ecosystems alone would
# open one PR per package per week, and a wall of PRs is how a security feed
# gets muted. One PR per ecosystem per week is reviewable; security updates are
# split into their own group so a real advisory is never buried in a routine
# version-bump PR.
#
# Cargo bumps are compile-checked by rust-checks.yml (cargo check / clippy /
# audit on PRs touching box/oscilloscope-daemon), but deployment is still
# manual: box.Dockerfile does not copy the binary -- it is built by hand
# (./build_daemon.sh) and mounted from the host at runtime. So a merged
# lockfile bump is a source fix only; boxes stay on the old binary until
# someone rebuilds and redistributes it.
version: 2

updates:
  # The daemon's Cargo.lock is where advisory 13 lives. Runtime scope: the
  # daemon opens QUIC/WebTransport listeners on 8082-8084 when start-services.sh
  # finds the binary present.
  - package-ecosystem: cargo
    directory: /box/oscilloscope-daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
      cargo-version-updates:
        applies-to: version-updates
        patterns: ['*']

  # Pinned action SHAs across the workflows (SHA-pinned since the zizmor
  # gate landed; dependabot keeps the pins moving). These gate every PR, so
  # a stale or yanked action is a CI outage, not just a staleness problem.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  # cli/setup.py install_requires.
  #
  # versioning-strategy: see the note on the /test ecosystem below. Same
  # reasoning applies here -- cli/setup.py declares python_requires=">=3.10",
  # so a raised floor can make the package uninstallable on a version it
  # claims to support.
  #
  # mcp is no longer declared here at all. It used to be a `[mcp]` extra on
  # cli/setup.py, which was the wrong home -- nothing under cli/ imports it
  # (#519) -- and it now lives in box/lager/docker/requirements-mcp.txt, with
  # its own ecosystem entry below.
  - package-ecosystem: pip
    directory: /cli
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ['*']
      pip-version-updates:
        applies-to: version-updates
        patterns: ['*']

  # box/lager/docker/requirements-mcp.txt -- the MCP SDK the box image runs.
  #
  # mcp majors used to be ignored (see PR #209) because no CI job installed
  # what the image would get, so a widened cap merged green while the service
  # broke at runtime. The `mcp-extra` job in unit-tests.yml now resolves this
  # file on its own in a clean venv and runs the mcp suite against it, so
  # majors can flow again and fail HONESTLY. That is exactly what happened
  # next: the SDK 2.0 cap-widening PR sat red on that job until the server was
  # ported to the MCPServer API, which is the signal working as designed
  # rather than noise to be suppressed. The same will hold at 3.0 -- expect
  # the next major's PR to be red until someone does the porting work.
  #
  # Note the FLOOR moves with a port, not just the ceiling: the server cannot
  # import under 1.x any more, so `mcp>=2.0.0,<3` is the honest constraint. A
  # dependabot PR that only widens the ceiling is superseded by the port, not
  # merged alongside it.
  #
  # Same directory as the docker ecosystem below, which watches the base image
  # digest. Distinct ecosystems on one directory do not collide.
  - package-ecosystem: pip
    directory: /box/lager/docker
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ['*']
      pip-version-updates:
        applies-to: version-updates
        patterns: ['*']

  # test/requirements-unit.txt.
  #
  # versioning-strategy is load-bearing here, not a preference. Dependabot's
  # pip default is `increase`, which raises the FLOOR to whatever currently
  # resolves. That is wrong for a file feeding a five-version compat matrix,
  # where the floors are held low on purpose: pip resolves differently per
  # interpreter, so the newest version is frequently unavailable on older ones.
  #
  # This is not hypothetical. The first run under the default opened a PR
  # raising `numpy>=2,<3` to `numpy>=2.5.1,<3`. numpy 2.5 requires Python 3.12,
  # so that floor is unsatisfiable on both 3.10 AND 3.11 -- and 3.11 is the
  # version every REQUIRED `unit (...)` context runs on. It failed nine of ten
  # checks; only `compat (py3.12)` passed.
  #
  # `increase-if-necessary` raises a floor only when the existing range cannot
  # admit the new version. `numpy>=2,<3` already admits 2.5.1, so it is left
  # alone. Do not change this back to the default.
  - package-ecosystem: pip
    directory: /test
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-deps:
        patterns: ['*']

  # box/lager/docker/box.Dockerfile's base image, pinned by digest.
  #
  # The pin is what lets a published box image share layers with the release
  # before it. box-image-publish.yml reuses a cached layer only while
  # everything above it is unchanged, and a box pull then downloads only the
  # layers that moved. A floating tag moves whenever Docker Hub rebuilds it,
  # and then every layer above it rebuilds with a new digest -- a full ~1 GB
  # download for every box, from a release that may have changed nothing.
  #
  # So the base moves here instead, as a reviewable PR. Merging one still
  # costs every box that full download on the next release, which is why this
  # runs monthly rather than weekly: security fixes in the base still arrive,
  # a few at a time rather than one download per rebuild upstream.
  #
  # The INTERPRETER does not move here; only the digest of the current tag
  # does. To dependabot, `python:3.12-slim-bookworm` -> `3.14-slim-bookworm`
  # is an ordinary version update, and it passes every PR check (#587 did, 19
  # of 19), because no PR workflow builds this image: the unit suites leave
  # the hardware SDKs out on purpose, `compat (py3.14)` resolves different
  # versions than the image pins, and the one test that reads the FROM line
  # asserts a digest pin, not a tag. The image's pins then have no wheel for
  # the new interpreter and the pip layer fails -- on every box, at once,
  # since `lager update` builds from main on the box by default. A new Python
  # minor is a deliberate change that builds the image and runs the bench
  # (#595). Closing a grouped PR does not stop the next run re-opening it, so
  # the stop has to live here.
  - package-ecosystem: docker
    directory: /box/lager/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      box-base-image:
        patterns: ['*']
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
