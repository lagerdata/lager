#
# The bench chain: nightly, and on every release tag. Proves, in causal
# order and against ONE commit, that the box can be updated and
# reinstalled and that its instruments still work afterwards:
#
#   Bench: Box Lifecycle (update paths -> uninstall -> install)
#     -> Bench: Integration Tests
#
# `needs:` is the whole ordering: integration runs only if lifecycle succeeded.
# On a red lifecycle the night reads as one red run with integration skipped —
# one attributable failure rather than two, and no instrument sweep against a
# box whose install just failed.
#
# Both called workflows keep their own triggers and stay independently
# dispatchable; neither carries a cron of its own any more. A local `uses:`
# reference runs from the same commit as this workflow, so both jobs exercise
# the same SHA.
#
# Concurrency is two-level, and the two groups must stay DIFFERENT.
#
#   bench-chain-<box>  (this workflow)  one chain at a time, end to end
#   hardware-ci-<box>  (each child)     one bench job at a time
#
# The children alone serialize jobs, not chains. The slot is released between
# lifecycle and integration, and a second chain waiting on the same group
# took it there on 2026-09-28: its lifecycle deployed a branch, and the first
# chain's integration then failed its ref-guard against a box that had just
# been moved off the commit it was testing. The night produced no hardware
# result. Holding bench-chain for the whole run makes a second chain wait
# until the first has finished both jobs.
#
# It must not be hardware-ci itself: a caller holding the children's group
# would wait on a child that wants the same slot, which deadlocks.
#
# Residual: a hand dispatch of Bench: Box Lifecycle on its own holds only
# hardware-ci, so it can still land between this chain's two jobs. The
# integration ref-guard reports that by name; it cannot pass silently.
#
# Instrument AC power (relays) lives inside each called workflow: each powers
# the Rigol/Keithley on at its start and off at its end. Deliberately NOT
# coordinated across the chain — a chain cancelled between jobs can therefore
# never strand the bench powered; the cost is one extra relay cycle per night.
#
# Notification: a red night files (or comments on) the single `bench-alert`
# issue, and a fully green night closes it — see the notify jobs at the bottom.
# Before them, a failing nightly notified NO ONE, and one 2026-08 outage ran
# eight consecutive red nights before a human noticed. The notify jobs run on
# HOSTED runners on purpose: the bench being down is exactly the condition
# under which they must still be able to run. Direct dispatches of the child
# workflows bypass notification — a dispatch has a human watching by
# definition — and so does a dispatch of THIS workflow on any ref but main,
# since the issue describes main's bench. A release-tag run files an alert
# but never closes one: a tag can be cut from a release branch, and a green
# run there says nothing about main. The alert names the commits added since
# the last green run of main.
# bench-watchdog.yml covers the
# remaining blind spot, the night that never starts (runner offline, cron
# dead).

name: "Bench: Nightly"

on:
  schedule:
    # Off-the-hour deliberately: GitHub's scheduled-event queue is heaviest at
    # :00 and delays runs -- a :00 cron fired 78 minutes late on 2026-07-24.
    #
    # That 78 minutes is NOT an upper bound, and this comment used to read as
    # though it were. Measured across the ten scheduled runs to 2026-09-01, the
    # delay ran 0.4-0.6h for four nights and then 4.6-10.9h for six, with no
    # change on this side. Moving off the hour helps; it does not bound the
    # delay, and nothing here can. bench-watchdog.yml measures the delay
    # against this cron and alarms when the mean gets large enough that a late
    # night and a missed night stop being distinguishable.
    - cron: "17 10 * * *"  # ~3 AM PDT / 2 AM PST (cron is UTC; drifts 1h across DST)
  # Release tags, not merges. The chain holds the bench for about an hour, and
  # running it on every merge to main kept MASTER busy for most of the working
  # day, so branch validation queued behind it. Merges are now covered by the
  # nightly, whose alert links the commits since the last green run, and each
  # release is tested on its own tagged commit.
  #
  # A tag run deploys github.sha, the tagged commit, exactly as a scheduled
  # run deploys main's head. Lifecycle also installs the newest release tag
  # from its pre-built GHCR image, and on a tag run that is the tag just
  # pushed, whose image box-image-publish.yml is still building. The
  # box-image job below holds the chain until that image is published.
  #
  # No path filter: GitHub does not evaluate paths for a tag push, and a
  # release must run whatever it changed.
  #
  # GitHub keeps one PENDING run per concurrency group and a newer arrival
  # replaces it. A dispatch of a feature branch waiting here can therefore be
  # lost to a tag push or the cron. Check the run list before dispatching.
  push:
    tags: ['v*']
  workflow_dispatch:

# See "Concurrency is two-level" above. `cancel-in-progress: false` protects a
# running chain; nothing can protect a pending one.
concurrency:
  group: bench-chain-${{ vars.LAGER_BOX || 'MASTER' }}
  cancel-in-progress: false

# Default token: checkout only. A job that needs more must say so itself.
permissions:
  contents: read

jobs:
  box-image:
    # On a tag run, wait for box-image-publish.yml to publish this tag's
    # image. Lifecycle's release-tag install leg fails without it, and the
    # publish usually takes 1-2 minutes but has taken 37 on a cold layer
    # cache. On every other trigger the step is skipped and the job passes
    # at once. Hosted, and holds no bench: the chain group is already taken,
    # so a tag run waits here instead of on the bench.
    #
    # A publish that never finishes fails this job after an hour. Lifecycle
    # is then skipped, and notify (failure) files the alert: a release with
    # no box image needs a person.
    name: wait for the release box image
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {}
    steps:
      - name: Wait for this tag's image on GHCR
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        # The registry probe is the one in
        # cli/deployment/scripts/setup_and_deploy_box.sh: an anonymous pull
        # token, then a HEAD of the manifest, published once it carries a
        # content digest.
        run: |
          repo_path="lagerdata/lager-box"
          accept="application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            token=$(curl -sS --connect-timeout 5 --max-time 15 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo_path}:pull" 2>/dev/null \
              | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
            digest=""
            if [ -n "$token" ]; then
              digest=$(curl -sS -I --connect-timeout 5 --max-time 15 \
                -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
                "https://ghcr.io/v2/${repo_path}/manifests/${TAG}" 2>/dev/null \
                | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}') || true
            fi
            case "$digest" in
              sha256:*) echo "ghcr.io/${repo_path}:${TAG} is published (${digest})"; exit 0 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=No box image for ${TAG}::ghcr.io/${repo_path}:${TAG} was not published within an hour. Check the Release: Publish Box Image run for this tag."
              exit 1
            fi
            echo "Waiting for ghcr.io/${repo_path}:${TAG}..."
            sleep 30
          done
        shell: bash

  lifecycle:
    # After box-image, which passes at once on every trigger but a tag push.
    needs: box-image
    uses: ./.github/workflows/update-regression.yml
    secrets: inherit

  integration:
    # Bare `needs:` already requires lifecycle to have SUCCEEDED — no `if:`
    # guard needed. A failed or cancelled lifecycle skips this job.
    needs: lifecycle
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  notify-failure:
    # `!= 'success'` rather than `failure()`: when lifecycle fails,
    # integration is SKIPPED, not failed, and a skipped instrument sweep is
    # exactly the half-covered night that must page someone. `!cancelled()`
    # keeps a manually cancelled run from alerting — cancellation has a human
    # attached. The ref test keeps a dispatch on a feature branch from filing
    # an alert about main: the issue describes main's bench, and a branch run
    # has a human watching it. A release tag files too: a red release must
    # page someone. Permissions are per-job so the called bench
    # workflows keep their default token.
    name: notify (failure)
    needs: [lifecycle, integration]
    if: ${{ !cancelled() && (needs.lifecycle.result != 'success' || needs.integration.result != 'success') && (github.event_name == 'schedule' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # Reads this workflow's run history for the last green commit.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: File or update the bench-alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIFECYCLE: ${{ needs.lifecycle.result }}
          INTEGRATION: ${{ needs.integration.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The commits this run added since the last fully green chain on
          # main are the first thing triage needs, and the run page does not
          # show them. `status=success` is the run's conclusion, which is
          # success only when both children succeeded -- the same condition
          # notify-recovery closes on. Best-effort: with no green run in
          # view, or an API hiccup, the alert still files, saying so.
          last_green=$(gh api \
            "repos/$GH_REPO/actions/workflows/nightly-bench.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -z "$last_green" ]; then
            range="No green chain run of main found to compare against."
          elif [ "$last_green" = "$SHA" ]; then
            range="The last green chain run tested this same commit (\`${SHA:0:12}\`), so no new code is suspect: look at the bench before the change under test."
          else
            range="Commits since the last green chain run: ${SERVER_URL}/${GH_REPO}/compare/${last_green:0:12}...${SHA:0:12}"
          fi

          cat > "$RUNNER_TEMP/alert-body.md" <<EOF
          Bench chain run failed (trigger: \`${EVENT}\`, ref \`${REF}\`, commit \`${SHA:0:12}\`): ${RUN_URL}

          ${range}

          | Job | Result |
          |---|---|
          | Box Lifecycle | ${LIFECYCLE} |
          | Integration Tests | ${INTEGRATION} |

          Triage order (see "Triage order" in .github/workflows/README.md):
          confirm the box is running the code under test first, then
          instrument power relays and USB enumeration, then whether the box's
          auth service is reachable, then the change under test. This issue is
          closed automatically by the next fully green chain run of main.
          EOF
          bash tools/bench_alert.sh alert "Nightly bench is failing" "$RUNNER_TEMP/alert-body.md"
        shell: bash

  notify-recovery:
    # `success()` fires this only when BOTH children succeeded. Closing on
    # green is what keeps the alert issue meaningful — an issue that stays
    # open after the bench recovers trains people to ignore it, which is the
    # same failure mode as a permanently-red check.
    #
    # Only a run of main may close it. A green dispatch on a feature branch
    # says nothing about main, and one closed the open alert on 2026-09-15
    # while scheduled nightlies had not run for five days (#552). A release
    # tag may not be on main either, so a green tag run leaves the alert for
    # the next nightly to close.
    name: notify (recovery)
    needs: [lifecycle, integration]
    if: ${{ success() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Close the bench-alert issue if one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Recovered: fully green nightly run %s\n' "$RUN_URL" > "$RUNNER_TEMP/recover-body.md"
          bash tools/bench_alert.sh recover "$RUNNER_TEMP/recover-body.md"
        shell: bash
