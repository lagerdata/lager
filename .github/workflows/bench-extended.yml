# SPDX-License-Identifier: Apache-2.0
#
# Weekly execution for bench tests that exist but run nowhere. Of the 38 bash
# integration suites, nightly CI executes exactly one (jlink_script.sh); the
# other 37 were syntax-checked and shellchecked but never run, so a real
# regression in the CLI surface they cover -- argument parsing, exit codes,
# box-level commands -- surfaced only when a human happened to run one against
# a bench. This workflow starts working that debt down.
#
# WAVE 1: five of the seven test/integration/infrastructure/ suites --
# deployment, devenv, nets, box_config and generic. They need a box but NO
# instruments.
#
# The other two are deliberately excluded, each for its own reason recorded
# beside the suite steps below: boxes_config.sh would print a network
# inventory into a public log, and python.sh tests a CLI surface that no
# longer exists.
#
# WAVE 2: the power suites -- supply.sh and battery.sh -- which DO need
# instruments. This workflow therefore now carries integration-tests.yml's
# relay-net self-heal and relay power steps, and the bench is energized for
# the wave-2 block only. It powers back down before the wave-1 suites, so
# their baselines still hold under the conditions they were measured in. See
# the block comment above those steps for why the relay steps are
# continue-on-error here and a hard gate over there.
#
# Ordering inside the run is load-bearing:
#   - the wave-2 instrument suites run FIRST, while the box is healthiest:
#     box_config.sh bounces the container and generic.sh mangles the runner's
#     own box registry, so instrument work after either would be measuring a
#     degraded bench.
#   - generic.sh runs LAST: it exercises `lager boxes delete-all` against the
#     runner's own lager config. It now snapshots and restores that config
#     around the destructive tests (issue #273 -- before that fix it wiped the
#     registry outright, taking out ~50 of its own later checks as well as
#     everything after it), but it still goes last: the restore is a bash
#     trap, and a SIGKILL or a step timeout can outrun it.
#   - box_config.sh runs late: it exercises box-config apply including the
#     container bounce + rollback path, so the box may be briefly degraded.
#   - A best-effort re-registration step follows the suites either way: these
#     scripts mutate the RUNNER's persistent lager config by design, and
#     every bench workflow re-registers its box at start, so damage is
#     bounded to one run -- but healing it here keeps this run's own tail
#     steps working too.
#
# Weekly, Saturday 14:17 UTC: clear of the nightly's worst case (10:17 UTC
# start + ~2.5h), off the hour for GitHub's scheduled-queue congestion, and
# serialized against the other bench workflows by the shared concurrency
# group below. This is a LEAF workflow (no workflow_call children), so the
# caller-holds-the-slot deadlock documented in nightly-bench.yml does not
# apply here.
#
# Security: this repo is PUBLIC and the runner drives real hardware, so this
# workflow deliberately does NOT trigger on `pull_request` -- a fork PR must
# not be able to execute code on the bench. To bench-test a branch, push it
# to this repo and workflow_dispatch on that ref.
#
# Output surface: several CLI errors print an "Available boxes:" list, so this
# log carries whatever the RUNNER's own box registry holds. That is safe only
# because the runner registers exactly one box and its address is a repository
# secret, which the runner masks. Registering anything else on the runner
# turns those error paths into a fleet listing in a public log -- keep the
# runner's registry to the CI box.
#
# Notification: a red run files/updates a `bench-alert-extended` issue via
# tools/bench_alert.sh -- its OWN label, separate from the nightly's
# `bench-alert`. There is deliberately NO recovery job here: a green weekly
# must never close an alert while the nightly is still failing. The separate
# label is what makes that safe to say out loud -- while both shared one
# label, the nightly's recovery job would close an issue describing a live
# Extended failure, and an Extended failure would append itself to the
# nightly's issue under the nightly's title. Nothing closes the Extended
# issue automatically; the body says so.

name: "Bench: Extended"

on:
  schedule:
    - cron: "17 14 * * 6"
  workflow_dispatch:
    inputs:
      box_name:
        description: "Lager box name (overrides vars.LAGER_BOX)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One physical bench: queue behind nightly/integration, never collide.
  group: hardware-ci-${{ vars.LAGER_BOX || 'MASTER' }}
  cancel-in-progress: false

jobs:
  extended:
    name: Run infrastructure suites on the bench
    runs-on: [self-hosted, lager-bench]
    timeout-minutes: 75
    env:
      LAGER_BOX: ${{ inputs.box_name || vars.LAGER_BOX || 'MASTER' }}
    steps:
      - name: Record what triggered this run
        # A run cancelled while queued shows only as `cancelled` in the run
        # list, with no annotation and no notification (see "Concurrency" in
        # README.md). Naming the trigger and ref in the job summary is what
        # makes it possible to tell afterwards WHICH run was displaced, and by
        # what. Cheap, and it costs nothing when nothing goes wrong.
        run: |
          {
            echo "### Run provenance"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Workflow | ${GITHUB_WORKFLOW} |"
            echo "| Triggered by | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Box | \`${LAGER_BOX}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install lager CLI (editable, from this repo)
        run: pip install -e cli/
        shell: bash

      - name: Sign in to the box access gateway
        env:
          LAGER_AUTH_URL: ${{ vars.LAGER_AUTH_URL }}
          LAGER_CI_EMAIL: ${{ secrets.LAGER_CI_EMAIL }}
          LAGER_CI_PASSWORD: ${{ secrets.LAGER_CI_PASSWORD }}
        run: lager login "$LAGER_AUTH_URL" --email "$LAGER_CI_EMAIL" --password "$LAGER_CI_PASSWORD"
        shell: bash

      - name: Register lager box
        run: |
          lager boxes add \
            --name "$LAGER_BOX" \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --yes
        shell: bash

      - name: Set up lager SSH key
        # Same identity mapping integration-tests.yml uses: box_config.sh and
        # deployment.sh ssh into the box directly with the default identity.
        run: |
          if [ ! -f ~/.ssh/lager_box ]; then
            ssh-keygen -t ed25519 -f ~/.ssh/lager_box -N "" -C "lager-box-access"
          fi
          grep -qF "$(cat ~/.ssh/lager_box.pub)" ~/.ssh/authorized_keys 2>/dev/null || \
            cat ~/.ssh/lager_box.pub >> ~/.ssh/authorized_keys
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          if ! grep -q "^# lager integration CI box identity" ~/.ssh/config; then
            {
              echo "# lager integration CI box identity"
              echo "Host ${{ secrets.LAGER_BOX_IP }}"
              echo "  IdentityFile ~/.ssh/lager_box"
              echo "Host $LAGER_BOX"
              echo "  HostName ${{ secrets.LAGER_BOX_IP }}"
              echo "  IdentityFile ~/.ssh/lager_box"
            } >> ~/.ssh/config
          fi
        shell: bash

      - name: Release a still-held box lock from a killed run
        # The CLI releases its auto-lock three ways (try/finally, atexit, and
        # a SIGTERM/SIGINT/SIGHUP handler), but a step timeout ends in
        # SIGKILL, which cannot be caught. The client-side release never
        # runs, and the box-side TTL becomes the only backstop -- 1800s by
        # default (cli/box_storage.py _DEFAULT_LOCK_TTL_SECONDS). An expired
        # lock is reaped automatically and needs no --force; an unexpired one
        # blocks the next run outright.
        #
        # That is a real collision for back-to-back runs -- dispatches during
        # a debugging session, or a re-run after a timeout, land well inside
        # 30 minutes. It is NOT a threat to the schedule: the nightly and
        # this weekly are hours apart, so any leaked lock has long expired.
        #
        # Forcing is safe here because the hardware-ci concurrency group
        # serialises every bench workflow against this box, so a lock still
        # held when this job starts belongs to a run that is no longer
        # running. update-regression.yml carries the same call for its own
        # leak path (a lost release POST rather than a signal).
        run: lager boxes unlock --box "$LAGER_BOX" --force 2>/dev/null || true
        shell: bash

      - name: Verify box connectivity
        # First authenticated contact after a fresh login can fail exactly
        # once while the gateway records the box<->auth-server link.
        run: lager hello --box "$LAGER_BOX" || lager hello --box "$LAGER_BOX"
        shell: bash

      # ---------------------------------------------------------------------
      # WAVE 2: instrument suites. The header's "the bench stays dark for the
      # whole run" describes wave 1 only; from here to the power-off below,
      # the bench is energized.
      #
      # These run FIRST, and the bench goes back to dark before deployment.sh,
      # so every wave-1 suite still runs under exactly the conditions its
      # baseline was measured in. That ordering is not negotiable in the other
      # direction either: box_config.sh bounces the container and generic.sh
      # mangles the runner's own box registry, so instrument work after them
      # would be testing a degraded bench.
      #
      # Unlike integration-tests.yml, the relay steps here are
      # continue-on-error with an id rather than a hard gate. There it is
      # right to fail fast -- every suite in that workflow needs an
      # instrument. Here five suites need no instruments at all and have been
      # running green weekly; a dead relay must not take them with it. The
      # aggregation gate at the end still turns a relay failure into a red
      # job, and the two suites below are skipped rather than run against a
      # dark bench, where they would fail every check for the wrong reason.
      # ---------------------------------------------------------------------

      - name: Ensure relay nets exist (self-heal)
        # Byte-identical to integration-tests.yml's step of the same name; see
        # there for why each arm exists. Kept as a copy rather than a
        # composite action because a bench workflow that cannot be read
        # top-to-bottom is how the last class of bench bug survived.
        id: relay-nets
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          box = os.environ["LAGER_BOX"]

          def lager(*args, parse=False):
              res = subprocess.run(["lager", *args, "--box", box],
                                   capture_output=True, text=True)
              if res.returncode != 0:
                  print(res.stdout + res.stderr)
                  sys.exit(f"lager {' '.join(args)} failed (rc {res.returncode})")
              return json.loads(res.stdout) if parse else res.stdout

          nets = lager("nets", "state", "--json", parse=True)
          names = {n.get("name") for n in nets}

          def labjack_address():
              for n in nets:
                  if "0x0CD5" in str(n.get("address", "")):
                      return n["address"]
              out = lager("instruments")
              m = re.search(r"USB0::0x0CD5::0x0007::[^:\s]*::INSTR", out)
              if not m:
                  sys.exit("cannot determine the LabJack VISA address")
              return m.group(0)

          for want, pin in ((os.environ["RIGOL_POWER_NET"], "FIO0"),
                            (os.environ["KEITHLEY_POWER_NET"], "FIO1")):
              if want in names:
                  print(f"{want} present")
                  continue
              squatter = next((n["name"] for n in nets
                               if n.get("role") == "gpio"
                               and n.get("pin") == pin), None)
              if squatter:
                  lager("nets", "rename", squatter, want)
                  print(f"renamed {squatter} -> {want} ({pin})")
              else:
                  lager("nets", "add", want, "gpio", pin, labjack_address())
                  print(f"created {want} on {pin}")

          for n in nets:
              if n.get("role") == "spi" and re.search(r"\bFIO[01]\b", json.dumps(n)):
                  lager("nets", "delete", n["name"], "spi", "--yes")
                  print(f"deleted SPI net {n['name']} - overlaps the relay pins")
          PY
        shell: bash

      - name: Power on bench instruments (AC relays)
        # Byte-identical run block to integration-tests.yml's step of the same
        # name, so a diff between the two files stays empty and any future
        # drift is visible rather than quiet.
        id: power-on
        if: steps.relay-nets.outcome == 'success'
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
          PROBE_SUPPLY_NET: ${{ vars.RIGOL_CH1_NET || 'supply2' }}
        run: |
          lager gpo "$RIGOL_POWER_NET" high --box "$LAGER_BOX"
          lager gpo "$KEITHLEY_POWER_NET" high --box "$LAGER_BOX"
          # EVERY instrument on the relays has to finish enumerating before any
          # suite runs -- not just the ones a suite talks to. A device that is
          # still coming up when this step returns hotplugs later, and the
          # hotplug restarts the box's hardware service underneath whatever is
          # already running.
          #
          # Measured from a dark relay: DP821 6s, Keithley 2281S 11s, Rigol
          # MSO5204 52s and 60s across two runs. The MSO5204 shares the
          # RIGOL_POWER outlet, so waiting only for the first two returned
          # about 35s before it had finished, and a command issued in that
          # window came back `Connection refused` on localhost:8080 --
          # reproduced deliberately on the bench, not inferred.
          #
          # This list is the bench's actual relay-powered inventory, so adding
          # an instrument to a relay means adding it here. An entry that is
          # genuinely gone fails this step BY NAME after 180s, which is the
          # outcome we want: the bench changed and the workflow should say so
          # rather than quietly race whatever is left.
          expected=(Rigol_DP821 Keithley_2281S Rigol_MS05204)
          enumerated=""
          missing=""
          for _ in $(seq 1 36); do
            out=$(lager instruments --box "$LAGER_BOX" 2>/dev/null || true)
            missing=""
            for inst in "${expected[@]}"; do
              printf '%s' "$out" | grep -q "$inst" || missing="$missing $inst"
            done
            if [ -z "$missing" ]; then
              enumerated=1
              break
            fi
            sleep 5
          done
          if [ -z "$enumerated" ]; then
            echo "Did not enumerate within 180s of relay power-on:$missing"
            exit 1
          fi
          echo "All relay-powered instruments enumerated."
          # Enumeration is not readiness: the USB hotplug from the relay
          # power-on restarts the box's hardware service, and supply
          # connections are refused for a few seconds after the instruments
          # appear (observed live: two Rigol suites failed inside that window
          # while everything after passed). Poll an actual supply read until
          # the service answers before letting any suite run.
          for _ in $(seq 1 24); do
            if lager supply "$PROBE_SUPPLY_NET" state --box "$LAGER_BOX" >/dev/null 2>&1; then
              echo "Hardware service is answering supply reads."
              exit 0
            fi
            sleep 5
          done
          echo "Hardware service did not answer supply reads within 120s of power-on"
          exit 1
        shell: bash

      - name: Suite supply.sh (Keithley 2281S in supply mode)
        # 59 checks against the `lager supply` CLI surface, measured at ~3m15s
        # on this bench. The suite had never executed anywhere before this.
        id: suite-supply
        if: steps.power-on.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          # The Keithley, NOT a DP821 channel. The suite sweeps voltage to 10V
          # (test 4.5) and sets current to 2.0A (tests 5.3, 5.5, 6.2, 7.2), and
          # neither DP821 channel does both: CH1 is 60V/1A and CH2 is 8V/10A.
          # Measured on the bench -- against CH1 (supply2) the four 2.0A checks
          # fail because the channel tops out at 1A, which is the instrument
          # being correct, not the CLI being wrong. supply1 is 20V/6A and
          # covers the whole range the suite asks for.
          #
          # Positional arg to the suite, not an env var it reads.
          SUPPLY_NET: ${{ vars.KEITHLEY_SUPPLY_NET || 'supply1' }}
          # Measured, not assumed. See the PR body for the run this came from.
          SUPPLY_BASELINE: "0"
        run: |
          LOG="$RUNNER_TEMP/supply.log"
          bash test/integration/power/supply.sh "$LAGER_BOX" "$SUPPLY_NET" 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh harness supply.sh "$SUPPLY_BASELINE" "$LOG"
        shell: bash

      - name: Suite battery.sh (Keithley 2281S battery simulator)
        # 86 checks against the `lager battery` CLI surface, measured at ~2m on
        # this bench. Also never executed before this. Its
        # `register_box_from_ip` helper only mutates the runner's registry when
        # handed an IP; LAGER_BOX is a name, so it takes the no-op branch.
        #
        # Shares the Keithley with supply.sh above and runs second: supply.sh
        # leaves the instrument in supply mode, and battery.sh selects battery
        # mode itself.
        id: suite-battery
        if: steps.power-on.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          BATTERY_NET: ${{ vars.KEITHLEY_BATTERY_NET || 'battery1' }}
          # Measured, not assumed. See the PR body for the run this came from.
          BATTERY_BASELINE: "0"
        run: |
          LOG="$RUNNER_TEMP/battery.log"
          bash test/integration/power/battery.sh "$LAGER_BOX" "$BATTERY_NET" 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh harness battery.sh "$BATTERY_BASELINE" "$LOG"
        shell: bash

      - name: Power off bench instruments (AC relays)
        # Restores the dark bench the wave-1 suites were baselined against.
        # `always()` so a failed instrument suite still hands the rest of the
        # run the conditions it expects; the tail step of the same name is the
        # backstop for a job that dies before reaching here. Two-stage
        # bracketing, same as update-regression.yml around its recovery step.
        #
        # Bounded in the shell rather than by `timeout-minutes` alone: a step
        # killed by its own bound prints nothing, and continue-on-error then
        # renders it as a green tick indistinguishable from a bench that
        # actually went dark, while the relays stay latched on.
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          for net in "$RIGOL_POWER_NET" "$KEITHLEY_POWER_NET"; do
            rc=0
            timeout 50 lager gpo "$net" low --box "$LAGER_BOX" || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning title=Bench may still be energized::'$net' did not go low within 50s on '$LAGER_BOX'. Assume the relay is latched on and the instrument is idling at AC."
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Bench may still be energized::'$net' low failed (exit $rc) on '$LAGER_BOX'. Assume the relay is latched on and the instrument is idling at AC."
            fi
          done
          exit 0
        shell: bash

      # Each suite is continue-on-error with an id so every suite runs and
      # the aggregation gate at the end turns any failure into a job failure
      # -- same pattern as integration-tests.yml, same reasoning.
      #
      # Each suite also declares a BASELINE: the number of its checks known to
      # fail today. tools/bench_suite_gate.sh ratchets two-sided -- more
      # failures than the baseline is red, fewer prints a notice telling you to
      # lower it. This is what lets the workflow land green on day one without
      # softening a single assertion. Every non-zero baseline names the issue
      # that owns it; a bare number with no issue behind it is softening.
      #
      # The suite's own exit status is deliberately dropped (`|| true`): it
      # carries the same information as the failure count, and reading it
      # through `tee` is how a gate ends up reporting tee's status. The gate
      # fails loudly if a suite produces no summary at all, which is what a
      # crash or a step timeout looks like.

      - name: Suite deployment.sh (box verification, no instruments)
        id: suite-deployment
        continue-on-error: true
        timeout-minutes: 10
        env:
          # The suite defaults to ssh user `lager`; this bench logs in as
          # `lagerdata`.
          SSH_USER: lagerdata
          # Expected clean. Its two failures were a stale expectation: the
          # suite inspected containers named `controller` and `python`, which
          # no longer exist -- there is one container, named `lager`. Fixed
          # rather than baselined.
          DEPLOYMENT_BASELINE: "0"
        run: |
          LOG="$RUNNER_TEMP/deployment.log"
          bash test/integration/infrastructure/deployment.sh "$LAGER_BOX" 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh deployment deployment.sh "$DEPLOYMENT_BASELINE" "$LOG"
        shell: bash

      # python.sh is deliberately NOT wired, for the same reason as
      # boxes_config.sh: it does not test the CLI we ship. 53 of its checks
      # invoke `lager python -c "<code>"` for inline execution, and there is
      # no `-c` option -- the runner reports "Error: No such option '-c'"
      # and the suite fails 43 of 84. Three of its checks pass `--image`,
      # which is likewise gone. It needs the rewrite devenv.sh already had,
      # against the current interface (a script path as the positional
      # RUNNABLE), and that is its own reviewable change. Baselining 43
      # failures here would record "calls an option that does not exist" as
      # the expected state and leave the ratchet watching for a 44th.
      #
      # Its other findings stand on their own and are filed as issue #274:
      # `--timeout` never fires, and a detached launch does not return.

      - name: Stop anything a suite left running on the box
        # Cheap insurance that survives python.sh being unwired: any suite
        # that starts work on the box and is then killed mid-step leaves it
        # behind, and the next suite inherits a busy box -- failures that
        # belong to no suite and would otherwise be baselined as if they did.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          # --kill-all, not --kill: --kill takes a process ID.
          timeout 45 lager python --box "$LAGER_BOX" --kill-all --signal sigkill >/dev/null 2>&1 || true
          for attempt in $(seq 1 24); do
            if lager hello --box "$LAGER_BOX" >/dev/null 2>&1; then
              echo "box responsive on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Bench Extended::box unresponsive after the python suite"
        shell: bash

      - name: Suite devenv.sh (local dev environment, runner-side docker)
        id: suite-devenv
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Clean, and expected to stay that way.
          DEVENV_BASELINE: "0"
        run: |
          LOG="$RUNNER_TEMP/devenv.log"
          bash test/integration/infrastructure/devenv.sh 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh harness devenv.sh "$DEVENV_BASELINE" "$LOG"
        shell: bash

      # boxes_config.sh is deliberately NOT wired: its discovery section
      # inventories every box reachable from the runner's network and prints
      # the results, and a full network inventory does not belong in a CI
      # log. It stays runnable by hand; wiring it here needs a CI-safe output
      # mode for the discovery commands first (counts, not names).

      - name: Suite nets.sh (net add/delete/rename lifecycle)
        # Its delete-all section is self-skipped in the script; individual
        # test-net operations only. Even so, the relay-net self-heal in the
        # instrumented workflows covers any net damage on their next run.
        id: suite-nets
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Clean. It measured 4 failures while python.sh ran ahead of it;
          # with that suite unwired every check passes. Keep at 0.
          NETS_BASELINE: "0"
        run: |
          LOG="$RUNNER_TEMP/nets.log"
          bash test/integration/infrastructure/nets.sh "$LAGER_BOX" 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh harness nets.sh "$NETS_BASELINE" "$LOG"
        shell: bash

      - name: Suite box_config.sh (box-config apply, bounce + rollback)
        # Late on purpose: exercises the container bounce path, so the box
        # may be briefly degraded; nothing after it needs full box health
        # except generic.sh's CLI-level checks.
        id: suite-box-config
        continue-on-error: true
        timeout-minutes: 15
        env:
          # 2 of 56, measured after the CARGO_TEST_CRATE fix. It was 6, and
          # four of those were one fixture bug: the crate named did not exist
          # on crates.io, `cargo install` returned 101, and that alone made
          # the whole apply report as not-applied. With a real crate, 6.10,
          # 6.16 and 6.19 pass -- so sysctl was never broken, which is what
          # 6.11/6.12/6.13 had been saying all along. 5.2 passes too, once it
          # stopped mistaking an unreachable box for a wrong answer.
          #
          # The two that remain are real, and both are issue #275:
          #   3.13  box_http_server.py still running with
          #         LAGER_DISABLE_UART_SERVICE set
          #   6.14  the cargo crate is absent from the container after an
          #         apply that reported success -- now a SILENT failure,
          #         where the nonexistent crate used to make it a loud one
          BOX_CONFIG_BASELINE: "2"
        run: |
          LOG="$RUNNER_TEMP/box-config.log"
          bash test/integration/infrastructure/box_config.sh "$LAGER_BOX" 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh harness box_config.sh "$BOX_CONFIG_BASELINE" "$LOG"
        shell: bash

      - name: Wait for the box to come back after the config bounce
        # box_config.sh ends by restarting the container, and generic.sh opens
        # with `lager hello`. Without this the first two hello checks failed
        # and the third passed eleven seconds later -- a race this workflow's
        # own suite ordering creates, which would otherwise be charged to
        # generic.sh's baseline and hide a real regression behind it.
        # continue-on-error so a box that never comes back is reported by the
        # suites themselves rather than as an opaque step failure here.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in $(seq 1 30); do
            if lager hello --box "$LAGER_BOX" >/dev/null 2>&1; then
              echo "box responded on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Bench Extended::box did not respond within 150s after the box-config bounce"
        shell: bash

      - name: Suite generic.sh (CLI-generic commands; LAST -- see header)
        id: suite-generic
        continue-on-error: true
        timeout-minutes: 15
        env:
          # 0 of 95. Was 5, and NOT because of repetition: Test 4.23 backed up
          # ".lager" relative to the checkout while the CLI writes
          # ${LAGER_CONFIG_FILE_DIR:-$HOME}/.lager, so the backup silently
          # never happened, `delete-all` wiped the real registry, and every
          # later check resolving --box failed 100% of the time. The 5- and
          # 10-call loops "passed" only because they run before 4.23. The
          # suite now snapshots and restores the config the CLI actually owns
          # (issue #273).
          GENERIC_BASELINE: "0"
        run: |
          LOG="$RUNNER_TEMP/generic.log"
          bash test/integration/infrastructure/generic.sh "$LAGER_BOX" 2>&1 | tee "$LOG" || true
          bash tools/bench_suite_gate.sh harness generic.sh "$GENERIC_BASELINE" "$LOG"
        shell: bash

      - name: Restore box registration (best effort)
        # generic.sh exercises `boxes delete-all` against the runner's lager
        # config; re-register so this run's remaining steps -- and any human
        # using the runner before the next workflow -- see a sane state.
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: |
          lager boxes add \
            --name "$LAGER_BOX" \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --yes || true
        shell: bash

      - name: Power off bench instruments (AC relays, backstop)
        # Second half of the bracket. The mid-run power-off above already runs
        # under always(), so this fires on the narrow case that it did not
        # finish -- a wedged relay eating its 50s bound, or the box briefly
        # unreachable while box_config.sh had the container down. Roughly 20
        # minutes of suites separate the two, which is 20 minutes of a bench
        # left at AC if the first attempt was the only one.
        #
        # Deliberately AFTER the registration restore: generic.sh runs
        # `boxes delete-all` against the runner's own config, and `lager gpo`
        # cannot address a box the runner no longer knows.
        #
        # Idempotent -- driving an already-low relay low is a no-op, and the
        # latched level needs nothing alive to hold it.
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          for net in "$RIGOL_POWER_NET" "$KEITHLEY_POWER_NET"; do
            rc=0
            timeout 50 lager gpo "$net" low --box "$LAGER_BOX" || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning title=Bench may still be energized::'$net' did not go low within 50s on '$LAGER_BOX'. Assume the relay is latched on and the instrument is idling at AC."
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Bench may still be energized::'$net' low failed (exit $rc) on '$LAGER_BOX'. Assume the relay is latched on and the instrument is idling at AC."
            fi
          done
          exit 0
        shell: bash

      - name: Fail job if any suite failed
        # Reads the steps context rather than a hand-kept id list -- adding a
        # suite needs no edit here. `outcome` is the pre-continue-on-error
        # result.
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          steps = json.loads(os.environ["STEPS_JSON"])
          bad = sorted(k for k, v in steps.items()
                       if isinstance(v, dict) and v.get("outcome") == "failure")
          if bad:
              print("One or more suites failed:")
              for name in bad:
                  print(f"  {name}")
              sys.exit(1)
          print("All suites passed.")
          PY
        shell: bash

  notify-failure:
    # Same alert path as the nightly; see the header for why there is no
    # recovery counterpart here.
    name: notify (failure)
    needs: [extended]
    if: ${{ !cancelled() && needs.extended.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: File or update the bench-extended alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Extended owns a SEPARATE label, and therefore a separate issue.
          # Sharing `bench-alert` meant a Saturday infrastructure failure
          # appended itself to whatever issue the NIGHTLY happened to be
          # using, under the title "Nightly bench is failing" -- pointing the
          # reader at the wrong workflow, the wrong schedule and the wrong
          # triage order. bench_alert.sh dedupes by LABEL, not by title, so
          # the label is what actually separates the two.
          BENCH_ALERT_LABEL: bench-alert-extended
          RESULT: ${{ needs.extended.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/alert-body.md" <<EOF
          Weekly extended bench run did not succeed (${RESULT}): ${RUN_URL}

          These are the infrastructure suites (no instruments involved), so
          triage starts at box reachability and the auth service, not at
          instrument power.

          **This issue does not close itself.** Extended has no recovery job
          by design -- a green weekly must never close an alert the nightly is
          still filing -- and it now carries its own \`bench-alert-extended\`
          label, so the nightly's recovery job does not see it either. Close
          it by hand once a weekly run is green.
          EOF
          bash tools/bench_alert.sh alert "Weekly extended bench is failing" "$RUNNER_TEMP/alert-body.md"
        shell: bash
