#
# Nightly box-lifecycle regression on the shared self-hosted bench. Exercises
# every lifecycle path a user actually runs, in an order where each step sets
# up the next and the box ends the run freshly installed on current main:
#
#   dry run (--check) -> downgrade to the previous release tag -> common-path
#   `lager update` (N-1 -> main, the path users hit most) -> no-op update
#   (asserts the "already at version" fast path, incl. its container-liveness
#   gate) -> forced clean rebuild -> hardware smoke -> uninstall -> install a
#   release tag (the pre-built-image path) -> install from scratch on main ->
#   final hardware smoke.
#
# Uninstall scope is deliberate and load-bearing:
#   - NEVER `--all`: it removes this runner's key from the box's
#     authorized_keys, and CI has no TTY for install's password fallback —
#     the bench would be stranded until someone re-keys it by hand.
#   - ALWAYS `--keep-config`: /etc/lager holds the saved bench nets AND
#     control_plane.json (the box's auth-gateway enrollment). Wiping either
#     breaks the rest of the run and the box's gateway auth.
#
# Shares integration-tests.yml's concurrency group so it never runs at the same
# time as the hardware suites against the one physical bench.
#
# No cron of its own: nightly-bench.yml invokes this workflow and then gates the
# instrument sweep on it succeeding, so this run decides whether the night's
# hardware suites happen at all. Still directly dispatchable on its own. No
# pull_request trigger — public repo + self-hosted runner driving real hardware.
#
# Instrument power: the Rigol and Keithley sit on AC relays driven by the
# bench LabJack (see .github/workflows/README.md). This job powers them on
# up front (its per-phase smokes need the Rigol) and back off at the end,
# so the bench is dark between runs.

name: "Bench: Box Lifecycle"

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # One physical bench: never run concurrently with integration-tests.
  group: hardware-ci-${{ vars.LAGER_BOX || 'MASTER' }}
  cancel-in-progress: false

# Default token: checkout only. A job that needs more must say so itself.
permissions:
  contents: read

jobs:
  box-lifecycle:
    name: Box lifecycle on the bench
    runs-on: [self-hosted, lager-bench]
    timeout-minutes: 90

    env:
      LAGER_BOX: ${{ vars.LAGER_BOX || 'MASTER' }}

    steps:
      - name: Record what triggered this run
        # A run cancelled while queued shows only as `cancelled` in the run
        # list, with no annotation and no notification (see "Concurrency" in
        # README.md). Naming the trigger and ref in the job summary is what
        # makes it possible to tell afterwards WHICH run was displaced, and by
        # what. Cheap, and it costs nothing when nothing goes wrong.
        run: |
          {
            echo "### Run provenance"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Workflow | ${GITHUB_WORKFLOW} |"
            echo "| Triggered by | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Box | \`${LAGER_BOX}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install lager CLI (editable, from this repo)
        run: pip install -e cli/
        shell: bash

      - name: Sign in to the box access gateway
        # The box is fronted by an authenticating gateway. The CLI stores the
        # session in ~/.lager_gateway_auth and silently refreshes it for the
        # rest of the run, so one login covers the whole job.
        env:
          LAGER_AUTH_URL: ${{ vars.LAGER_AUTH_URL }}
          LAGER_CI_EMAIL: ${{ secrets.LAGER_CI_EMAIL }}
          LAGER_CI_PASSWORD: ${{ secrets.LAGER_CI_PASSWORD }}
        run: lager login "$LAGER_AUTH_URL" --email "$LAGER_CI_EMAIL" --password "$LAGER_CI_PASSWORD"
        shell: bash

      - name: Register lager box
        run: |
          lager boxes add \
            --name "$LAGER_BOX" \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --yes
        shell: bash

      - name: Set up lager SSH key
        run: |
          if [ ! -f ~/.ssh/lager_box ]; then
            ssh-keygen -t ed25519 -f ~/.ssh/lager_box -N "" -C "lager-box-access"
          fi
          grep -qF "$(cat ~/.ssh/lager_box.pub)" ~/.ssh/authorized_keys 2>/dev/null || \
            cat ~/.ssh/lager_box.pub >> ~/.ssh/authorized_keys
          # install/uninstall probe SSH with the DEFAULT identity (plain
          # `ssh user@ip`), unlike update which passes the lager key
          # explicitly. Point default ssh at the key for this host so the
          # reinstall phase authenticates non-interactively.
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          if ! grep -q "^# lager lifecycle CI box identity" ~/.ssh/config; then
            {
              echo "# lager lifecycle CI box identity"
              echo "Host ${{ secrets.LAGER_BOX_IP }}"
              echo "  IdentityFile ~/.ssh/lager_box"
            } >> ~/.ssh/config
          fi
        shell: bash

      - name: Verify box connectivity
        # First authenticated contact after a fresh login can fail while the
        # gateway records the box<->auth-server link, and the gateway itself can
        # be briefly unreachable. Retrying once with no backoff is not enough:
        # both attempts land inside the same blip (observed 2026-07-24, two
        # "auth server is unreachable" failures 1.4s apart). This step gates the
        # whole night's bench coverage, so poll instead — same window as the
        # post-reinstall health check below.
        run: |
          for _ in $(seq 1 12); do
            lager hello --box "$LAGER_BOX" && exit 0
            sleep 10
          done
          echo "Box did not become reachable within 120s"
          exit 1
        shell: bash

      - name: Ensure relay nets exist (self-heal)
        # People testing on the bench sometimes rebuild the box's nets with
        # `lager nets delete-all` + `add-all`. That wipes the named relay
        # nets (add-all re-fills FIO0/FIO1 as numbered gpio nets) and
        # recreates the default LabJack SPI net on FIO0-FIO3, whose CS/SCK
        # lines ARE the relay controls. Heal here instead of failing the
        # night: rename the squatter net back (preserves its record),
        # create the net fresh when the pin is empty, and delete any SPI
        # net overlapping the relay pins. Hard gate — if this cannot be
        # healed, the power-on step below could not work either. Kept in
        # both bench workflows: either can be the first to run after a
        # wipe (push-to-main runs integration alone).
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          box = os.environ["LAGER_BOX"]

          def lager(*args, parse=False):
              res = subprocess.run(["lager", *args, "--box", box],
                                   capture_output=True, text=True)
              if res.returncode != 0:
                  print(res.stdout + res.stderr)
                  sys.exit(f"lager {' '.join(args)} failed (rc {res.returncode})")
              return json.loads(res.stdout) if parse else res.stdout

          nets = lager("nets", "state", "--json", parse=True)
          names = {n.get("name") for n in nets}

          def labjack_address():
              for n in nets:
                  if "0x0CD5" in str(n.get("address", "")):
                      return n["address"]
              out = lager("instruments")
              m = re.search(r"USB0::0x0CD5::0x0007::[^:\s]*::INSTR", out)
              if not m:
                  sys.exit("cannot determine the LabJack VISA address")
              return m.group(0)

          for want, pin in ((os.environ["RIGOL_POWER_NET"], "FIO0"),
                            (os.environ["KEITHLEY_POWER_NET"], "FIO1")):
              if want in names:
                  print(f"{want} present")
                  continue
              squatter = next((n["name"] for n in nets
                               if n.get("role") == "gpio"
                               and n.get("pin") == pin), None)
              if squatter:
                  lager("nets", "rename", squatter, want)
                  print(f"renamed {squatter} -> {want} ({pin})")
              else:
                  lager("nets", "add", want, "gpio", pin, labjack_address())
                  print(f"created {want} on {pin}")

          for n in nets:
              if n.get("role") == "spi" and re.search(r"\bFIO[01]\b", json.dumps(n)):
                  lager("nets", "delete", n["name"], "spi", "--yes")
                  print(f"deleted SPI net {n['name']} - overlaps the relay pins")
          PY
        shell: bash

      - name: Power on bench instruments (AC relays)
        # The Rigol DP821 and Keithley 2281S sit on AC power relays driven by
        # the bench LabJack (control high = outlet on); the bench is dark
        # between runs. Power both up front so they stay on for the whole
        # lifecycle. The driven level latches in LabJack hardware and the
        # LabJack keeps USB power through the uninstall/reinstall window, so
        # the drive survives the whole job. Only the Rigol gates this step —
        # it is what the per-phase smokes use; the Keithley is powered as a
        # warm-up for the chained integration run, which verifies it itself.
        # `lager instruments` exits non-zero on transient connectivity
        # errors, hence `|| true` per attempt.
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
          PROBE_SUPPLY_NET: ${{ vars.RIGOL_CH1_NET || 'supply2' }}
        run: |
          lager gpo "$RIGOL_POWER_NET" high --box "$LAGER_BOX"
          lager gpo "$KEITHLEY_POWER_NET" high --box "$LAGER_BOX"
          enumerated=""
          for _ in $(seq 1 36); do
            out=$(lager instruments --box "$LAGER_BOX" 2>/dev/null || true)
            if printf '%s' "$out" | grep -q 'Rigol_DP821'; then
              enumerated=1
              break
            fi
            sleep 5
          done
          if [ -z "$enumerated" ]; then
            echo "Rigol did not enumerate within 180s of relay power-on"
            exit 1
          fi
          echo "Rigol enumerated."
          # Enumeration is not readiness: the USB hotplug from the relay
          # power-on restarts the box's hardware service and supply
          # connections are refused for a few seconds afterwards. Poll an
          # actual supply read before the first smoke runs.
          for _ in $(seq 1 24); do
            if lager supply "$PROBE_SUPPLY_NET" state --box "$LAGER_BOX" >/dev/null 2>&1; then
              echo "Hardware service is answering supply reads."
              exit 0
            fi
            sleep 5
          done
          echo "Hardware service did not answer supply reads within 120s of power-on"
          exit 1
        shell: bash

      - name: Determine previous release tag
        # The downgrade target: second-newest v* tag, i.e. what a slightly
        # stale fielded box would be running. Floored at v0.32.0 — a current
        # CLI cannot drive a pre-migration box (hardware-service :9000 +
        # gateway auth landed in v0.32.0), so older targets would test an
        # unsupported skew, not a real upgrade path.
        run: |
          PREV_TAG=$(git ls-remote --tags --refs origin 'v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -2 | head -1)
          PREV_TAG=$(printf '%s\n' "$PREV_TAG" v0.32.0 | sort -V | tail -1)
          echo "Previous release tag: $PREV_TAG"
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
          # Newest tag: the release-tag install leg below needs a version that
          # has a published box image, and only release tags publish one.
          LATEST_TAG=$(git ls-remote --tags --refs origin 'v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -1)
          echo "Latest release tag: $LATEST_TAG"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
        shell: bash

      - name: Update dry run (--check)
        # rc 0 = up to date, rc 1 = update available; both fine. --check must
        # not mutate the box; the phases below prove the real paths.
        run: |
          rc=0; lager update --check --box "$LAGER_BOX" || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
        shell: bash

      - name: Downgrade to previous release (version pin + rollback path)
        run: lager update --box "$LAGER_BOX" --version "$PREV_TAG" --yes --verbose
        shell: bash

      - name: Verify box healthy on previous release
        run: lager hello --box "$LAGER_BOX"
        shell: bash

      - name: Common-path update (previous release -> the commit under test)
        # The update invocation users actually run. If a release breaks
        # upgrading from the previous release, THIS step goes red.
        #
        # Pinned to github.sha rather than left on the CLI's `main` default.
        # The N-1 -> current upgrade is still exactly what is exercised, but
        # the box now lands on the commit this run is testing, which is what
        # integration-tests.yml's guard compares against. Leaving it on `main`
        # made the two jobs disagree whenever anything merged between them
        # (#326).
        run: lager update --box "$LAGER_BOX" --version "${{ github.sha }}" --yes --verbose
        shell: bash

      - name: Verify box healthy on main
        run: lager hello --box "$LAGER_BOX"
        shell: bash

      - name: No-op update hits the fast path
        # Re-running with the box already current must take the "already at
        # version" early-exit (which also verifies the container-liveness and
        # version-file reconciliation logic behind it).
        run: |
          set -o pipefail
          lager update --box "$LAGER_BOX" --yes | tee "$RUNNER_TEMP/noop-update.log"
          grep -q "already at version" "$RUNNER_TEMP/noop-update.log"
        shell: bash

      - name: Forced clean rebuild (--force)
        run: lager update --force --box "$LAGER_BOX" --yes --verbose
        shell: bash

      - name: Verify box healthy after rebuild
        run: lager hello --box "$LAGER_BOX"
        shell: bash

      - name: Hardware smoke after update phases
        # Separate smoke per phase so a red run attributes cleanly to
        # update-vs-install.
        env:
          SUPPLY_NET: ${{ vars.RIGOL_CH1_NET || 'supply2' }}
          CHANNEL_MAX_VOLTAGE: ${{ vars.RIGOL_CH1_MAX_VOLTAGE || '60.0' }}
          CHANNEL_MAX_CURRENT: ${{ vars.RIGOL_CH1_MAX_CURRENT || '1.0' }}
        # --passenv is required: `lager python` runs the script on the box
        # and forwards env only through --env/--passenv (see the note in
        # integration-tests.yml).
        run: |
          lager python test/api/power/test_supply_Rigol_DP821.py --box "$LAGER_BOX" \
            --passenv SUPPLY_NET --passenv CHANNEL_MAX_VOLTAGE --passenv CHANNEL_MAX_CURRENT
        shell: bash

      - name: Uninstall box software (scoped — see header)
        run: lager uninstall --box "$LAGER_BOX" --yes --keep-config
        shell: bash

      - name: Install a release tag (exercises the pre-built-image path)
        # The ONLY leg that can exercise the GHCR pull. The install below
        # targets `main`, and a branch has no published image by design, so
        # without this step the resolve/pull/verify/retag path that every
        # release-tag install now takes by default has no CI coverage at all.
        #
        # Ordering: this runs BEFORE the main install, so the box still ends
        # the run on current main, as the header promises. Two installs
        # back-to-back is safe now that a job is neither refused nor made to
        # wait on its own box lock -- if this step ever hangs acquiring, that
        # is a real finding about the lock scope, not flake here.
        #
        # By --ip for the same reason as the step below: uninstall removed the
        # local box entry.
        run: |
          set -o pipefail
          lager install \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --version "$LATEST_TAG" \
            --yes 2>&1 | tee /tmp/tag-install.log
        shell: bash

      - name: Assert the release-tag install used the pre-built image
        # Two layers, because the halves become testable at different times.
        #
        # The operator half -- resolving the tag to a digest and threading it
        # to the box -- lives in the CLI, so it always runs from the commit
        # under test and is asserted unconditionally.
        #
        # The box half runs start_box.sh from the DEPLOYED TAG's checkout, not
        # from this commit, so it can only be verified once a release carrying
        # that support exists. Until then this reports a notice rather than
        # failing. What it must never do is pass quietly: if the log shows
        # neither a pull nor a build, the markers have drifted and this check
        # has stopped meaning anything, so that case is an error.
        run: |
          if ! grep -q 'Pre-built image resolved' /tmp/tag-install.log; then
            echo "::error title=No pre-built image resolved for ${LATEST_TAG}::The install did not resolve a digest. Either the publish workflow has not produced an image for this tag, or the resolver is broken. Both need a person."
            exit 1
          fi
          echo "Resolved a digest for ${LATEST_TAG} (operator half OK)"

          if grep -q 'pulled from the registry' /tmp/tag-install.log; then
            echo "Box used the pre-built image (full pull path verified)"
          elif grep -q 'Building Lager Box container' /tmp/tag-install.log; then
            echo "::notice title=${LATEST_TAG} predates on-box pull support::The digest was resolved and threaded, but this tag's start_box.sh builds instead of pulling. Expected until the first release containing the pull support; the box half is unverified in this run."
          else
            echo "::error title=Cannot tell how the box obtained its image::Neither the pull nor the build marker appeared in the install log. The markers have drifted and this assertion no longer proves anything."
            exit 1
          fi
        shell: bash

      - name: Install box software from scratch
        # By --ip: uninstall --yes removes the local box entry as part of its
        # cleanup, so --box would no longer resolve here.
        #
        # Same pin as the update step above: the box must finish this run on the
        # commit under test, because this is the last thing to touch it before
        # the instrument suite runs against it.
        #
        # Note a commit has no pre-built image (only release tags are published),
        # so this install builds on the box. That is the pre-existing behaviour
        # for `--version main` too -- the pin does not make it slower.
        run: |
          lager install \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --version "${{ github.sha }}" \
            --yes
        shell: bash

      - name: Re-register lager box
        # install --yes deliberately skips the add-box prompt.
        run: |
          lager boxes add \
            --name "$LAGER_BOX" \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --yes
        shell: bash

      - name: Release the install auto-lock (workaround)
        # install's lock release can be lost when the deploy restarts the
        # box's docker daemon (the single-shot release POST races the
        # gateway coming back up), leaving the box locked against its own
        # job for the full lock TTL. Force-release our own leaked lock
        # before verifying. Product follow-up tracked: the release should
        # retry, and a same-job unlock should match the CI holder identity
        # without --force.
        run: lager boxes unlock --box "$LAGER_BOX" --force 2>/dev/null || true
        shell: bash

      - name: Verify box healthy after reinstall
        # Fresh containers and the gateway need a settling window after the
        # deploy's docker-daemon restart; poll for up to two minutes.
        run: |
          for _ in $(seq 1 12); do
            lager hello --box "$LAGER_BOX" && exit 0
            sleep 10
          done
          echo "Box did not become healthy within 120s of reinstall"
          exit 1
        shell: bash

      - name: Hardware smoke after reinstall
        env:
          SUPPLY_NET: ${{ vars.RIGOL_CH1_NET || 'supply2' }}
          CHANNEL_MAX_VOLTAGE: ${{ vars.RIGOL_CH1_MAX_VOLTAGE || '60.0' }}
          CHANNEL_MAX_CURRENT: ${{ vars.RIGOL_CH1_MAX_CURRENT || '1.0' }}
        # --passenv is required: `lager python` runs the script on the box
        # and forwards env only through --env/--passenv (see the note in
        # integration-tests.yml).
        run: |
          lager python test/api/power/test_supply_Rigol_DP821.py --box "$LAGER_BOX" \
            --passenv SUPPLY_NET --passenv CHANNEL_MAX_VOLTAGE --passenv CHANNEL_MAX_CURRENT
        shell: bash

      - name: Power off bench instruments (AC relays, pre-recovery)
        # Dark-bench policy: leave the Rigol and Keithley unpowered between
        # runs. Best-effort: `lager gpo` is an HTTP call to the box software,
        # which does not exist if the run died inside the uninstall->install
        # window — the post-recovery step below gets a second chance once
        # recovery has reinstalled it.
        #
        # Bounded in the shell so a relay left latched on is something the run
        # says rather than something the next person at the bench finds: a step
        # killed by `timeout-minutes` prints nothing and `continue-on-error`
        # renders it green. Expected to warn when the box software is missing,
        # which is exactly the case the post-recovery step exists to clean up.
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          for net in "$RIGOL_POWER_NET" "$KEITHLEY_POWER_NET"; do
            rc=0
            timeout 50 lager gpo "$net" low --box "$LAGER_BOX" || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning title=Bench may still be energized (pre-recovery)::'$net' did not go low within 50s on '$LAGER_BOX'. The post-recovery power-off gets a second chance; if it warns too, assume the relay is latched on."
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Bench may still be energized (pre-recovery)::'$net' low failed (exit $rc) on '$LAGER_BOX'. The post-recovery power-off gets a second chance; if it warns too, assume the relay is latched on."
            fi
          done
          exit 0
        shell: bash

      - name: Recovery — leave the bench usable on failure
        # The uninstall->install window is the one place a failure leaves the
        # box with nothing. One best-effort reinstall converts "transient
        # failure strands hardware CI for a week" into "red run, healthy
        # bench". The run itself stays red.
        #
        # cancelled() is included deliberately: a run cancelled mid-install
        # leaves the box stripped, and plain failure() does not fire on
        # cancellation — the one observed bench stranding happened exactly
        # this way. Prefer letting this workflow fail over cancelling it
        # once the uninstall step has started.
        #
        # Pinned to github.sha for the same reason as the steps above: recovery
        # should leave the bench on a known commit, not on whatever `main`
        # happens to be by the time a failing run reaches this step.
        if: failure() || cancelled()
        run: |
          lager install \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --version "${{ github.sha }}" \
            --yes || true
          lager boxes add \
            --name "$LAGER_BOX" \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --yes || true
          lager boxes unlock --box "$LAGER_BOX" --force 2>/dev/null || true
          lager hello --box "$LAGER_BOX" || true
        shell: bash

      - name: Best-effort lock cleanup
        # install/`lager python` auto-lock the box; if a step died in a way
        # that bypassed the CLI's release hook, free the lock rather than
        # waiting out the server TTL. --force because the lock identity
        # embeds the acquiring PID — a plain unlock from this (different)
        # process is refused as a different holder, observed as a 403 in
        # the box log. This is the end of the job on a CI-owned bench;
        # there is no other holder to stomp.
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: lager boxes unlock --box "$LAGER_BOX" --force 2>/dev/null || true
        shell: bash

      - name: Power off bench instruments (AC relays, post-recovery)
        # Second chance for the dark-bench policy: recovery has reinstalled
        # the box software and re-registered the box, so a power-off that
        # failed mid-lifecycle can succeed now. On a clean run this is a
        # harmless re-drive of an already-low pin. If even this fails,
        # recovery itself failed — the relays stay latched on and the
        # instruments idle at AC (harmless); the bench needs a hand anyway.
        # This is the last word on the bench's power state, so it is the one
        # that has to be audible: bounded in the shell and annotated on both
        # the timeout and the plain-failure path, because a step killed by
        # `timeout-minutes` prints nothing and `continue-on-error` renders it
        # as a green tick identical to a bench that actually went dark.
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          for net in "$RIGOL_POWER_NET" "$KEITHLEY_POWER_NET"; do
            rc=0
            timeout 50 lager gpo "$net" low --box "$LAGER_BOX" || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning title=Bench may still be energized::'$net' did not go low within 50s on '$LAGER_BOX' after recovery. Assume the relay is latched on and the instrument is idling at AC; the bench needs a hand."
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Bench may still be energized::'$net' low failed (exit $rc) on '$LAGER_BOX' after recovery. Assume the relay is latched on and the instrument is idling at AC; the bench needs a hand."
            fi
          done
          exit 0
        shell: bash
