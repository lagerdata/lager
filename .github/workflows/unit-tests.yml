#
# Non-hardware unit tests. They need no bench and no self-hosted runner, so
# they run on GitHub-hosted ubuntu-latest and gate pull requests.
#
# Each suite runs as its OWN matrix job because they want incompatible
# `sys.modules` states for the name `lager`. test/unit/measurement/conftest.py
# registers a placeholder `lager` whose __init__ never executes (to skip the
# heavy box deps); test/unit/box/conftest.py imports the real package. Both
# load at preparse, so a shared process is correct only if box happens to win
# — and depending on argument order for correctness is precisely the fragility
# test/unit/box/conftest.py exists to remove. One suite, one process.
#
# `--import-mode=importlib` avoids clashes between same-named test modules
# across suites. `-c /dev/null` is a house invariant (test/CONVENTIONS.md):
# it stops test/mcp from shadowing the `mcp` PyPI package. Note it also sets
# rootdir and confcutdir to /dev, which WIDENS conftest discovery to every
# ancestor directory — so if a repo-root conftest.py is ever added, every job
# here will load it and it must not touch sys.modules['lager'].

name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Some suites import box-side code, and some tests spawn subprocesses
      # that import `test.*`. Put repo root and box/ on PYTHONPATH so both
      # resolve consistently — in-process AND in subprocesses — regardless
      # of how pytest is invoked.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    strategy:
      fail-fast: false
      matrix:
        include:
          # cli/tests/ rides in the existing `unit (cli)` context rather than
          # getting its own: the two share a process cleanly in either order,
          # and a new context would need a separate branch-ruleset update
          # before it could block anything.
          - name: cli
            path: test/unit/cli/ cli/tests/
          - name: box
            path: test/unit/box/
          - name: measurement
            path: test/unit/measurement/
          - name: blufi
            path: test/unit/blufi/
          - name: mcp
            path: test/mcp/unit/
          - name: root
            path: test/unit/test_*.py test/test_*.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install CLI + test deps
        run: |
          pip install -e cli/
          # Pinned: an unpinned pytest makes every required context float on
          # whatever released last night. The import-mode=importlib module
          # naming rules changed in 8.1, which would break collection here
          # with no repo change to point at.
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3'
          pip install -r test/requirements-unit.txt
        shell: bash

      - name: Run ${{ matrix.name }} unit tests
        run: pytest ${{ matrix.path }} -v --import-mode=importlib -c /dev/null --timeout=60
        shell: bash

  # cli/setup.py declares python_requires=">=3.10" and advertises 3.10 through
  # 3.14; the gate above tests 3.11 only. This job covers the other four.
  #
  # It is deliberately a SEPARATE job rather than another matrix dimension on
  # unit-tests. Adding `python` to that matrix would rename its contexts from
  # `unit (cli)` to `unit (cli, 3.11)`, and those names are required in the
  # branch ruleset -- every open PR would sit forever waiting on checks that no
  # longer report.
  #
  # One context per version, with the suites run sequentially inside it: they
  # cannot share a pytest process (see the header), and six matrix jobs per
  # version would be 24 contexts for no extra signal.
  # 3.13 and 3.14 are NOT here yet, and that is a known gap rather than an
  # oversight: box/lager/python/service.py imports `cgi`, which PEP 594 removed
  # in 3.13, so the box suite cannot even be collected there. Migrating the
  # multipart parsing off cgi.FieldStorage touches the box's file-upload path
  # and is tracked separately. Add both versions back once that lands.
  #
  # They are omitted rather than left failing on purpose: a permanently-red
  # advisory check teaches people to ignore red, and this job has already
  # delivered the finding it exists to produce.
  compat:
    name: compat (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install CLI + test deps
        run: |
          pip install -e cli/
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3'
          pip install -r test/requirements-unit.txt
        shell: bash

      # Run every suite even if an earlier one fails, then fail once at the
      # end -- otherwise a break in the first suite hides the state of the
      # other five, which is the whole point of a version-compat run.
      - name: Run all unit suites on ${{ matrix.python }}
        run: |
          fail=0
          run() {
            echo "::group::$1"
            pytest $2 -q --import-mode=importlib -c /dev/null --timeout=60 || fail=1
            echo "::endgroup::"
          }
          run cli         "test/unit/cli/ cli/tests/"
          run box         "test/unit/box/"
          run measurement "test/unit/measurement/"
          run blufi       "test/unit/blufi/"
          run mcp         "test/mcp/unit/"
          run root        "test/unit/test_*.py test/test_*.py"
          exit $fail
        shell: bash
