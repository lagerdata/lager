#
# Non-hardware unit tests. They need no bench and no self-hosted runner, so
# they run on GitHub-hosted ubuntu-latest and gate pull requests.
#
# Each suite runs as its OWN matrix job. The box/measurement/blufi conftests
# now share one bootstrap recipe — the real `lager` package plus targeted
# stubs for absent box-only libs (flask_socketio, pygdbmi, bleak) — but
# one-suite-one-process stays the contract: the stubs are process-wide
# `sys.modules` surgery and differ per suite, individual box test modules
# still do their own import surgery at module level, and separate jobs keep
# failure attribution per suite. Never run bare `pytest test/unit/`.
#
# `--import-mode=importlib` avoids clashes between same-named test modules
# across suites. `-c /dev/null` is a house invariant (test/CONVENTIONS.md):
# it stops test/mcp from shadowing the `mcp` PyPI package. Note it also sets
# rootdir and confcutdir to /dev, which WIDENS conftest discovery to every
# ancestor directory — so if a repo-root conftest.py is ever added, every job
# here will load it and it must not touch sys.modules['lager'].

# Display name only — the JOB names below ("unit (...)", "compat (...)") are
# pinned as required contexts in the main branch ruleset; never rename those.
name: "PR Gate: Unit Tests"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default token: checkout only. A job that needs more must say so itself.
permissions:
  contents: read

jobs:
  unit-tests:
    name: unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Some suites import box-side code, and some tests spawn subprocesses
      # that import `test.*`. Put repo root and box/ on PYTHONPATH so both
      # resolve consistently — in-process AND in subprocesses — regardless
      # of how pytest is invoked.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    strategy:
      fail-fast: false
      matrix:
        include:
          # cli/tests/ rides in the existing `unit (cli)` context rather than
          # getting its own: the two share a process cleanly in either order,
          # and a new context would need a separate branch-ruleset update
          # before it could block anything.
          - name: cli
            path: test/unit/cli/ cli/tests/
          - name: box
            path: test/unit/box/
          - name: measurement
            path: test/unit/measurement/
          - name: blufi
            path: test/unit/blufi/
          - name: mcp
            path: test/mcp/unit/
          - name: root
            path: test/unit/test_*.py test/test_*.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install CLI + test deps
        run: |
          pip install -e cli/
          # Pinned: an unpinned pytest makes every required context float on
          # whatever released last night. The import-mode=importlib module
          # naming rules changed in 8.1, which would break collection here
          # with no repo change to point at.
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3'
          pip install -r test/requirements-unit.txt
        shell: bash

      - name: Run ${{ matrix.name }} unit tests
        run: pytest ${{ matrix.path }} -v --import-mode=importlib -c /dev/null --timeout=60
        shell: bash

  # cli/setup.py declares python_requires=">=3.10" and advertises 3.10 through
  # 3.14; the gate above tests 3.11 only. This job covers the other four.
  #
  # It is deliberately a SEPARATE job rather than another matrix dimension on
  # unit-tests. Adding `python` to that matrix would rename its contexts from
  # `unit (cli)` to `unit (cli, 3.11)`, and those names are required in the
  # branch ruleset -- every open PR would sit forever waiting on checks that no
  # longer report.
  #
  # One context per version, with the suites run sequentially inside it: they
  # cannot share a pytest process (see the header), and six matrix jobs per
  # version would be 24 contexts for no extra signal.
  #
  # 3.13 and 3.14 were previously omitted: box/lager/python/service.py imported
  # `cgi`, which PEP 594 removed in 3.13, so the box suite could not even be
  # collected there. That file now parses multipart with
  # werkzeug.sansio.multipart, `cgi` is gone from the tree, and both versions
  # are in the matrix. Every advertised version is now covered.
  compat:
    name: compat (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install CLI + test deps
        run: |
          pip install -e cli/
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3'
          pip install -r test/requirements-unit.txt
        shell: bash

      # Run every suite even if an earlier one fails, then fail once at the
      # end -- otherwise a break in the first suite hides the state of the
      # other five, which is the whole point of a version-compat run.
      - name: Run all unit suites on ${{ matrix.python }}
        run: |
          fail=0
          run() {
            echo "::group::$1"
            pytest $2 -q --import-mode=importlib -c /dev/null --timeout=60 || fail=1
            echo "::endgroup::"
          }
          run cli         "test/unit/cli/ cli/tests/"
          run box         "test/unit/box/"
          run measurement "test/unit/measurement/"
          run blufi       "test/unit/blufi/"
          run mcp         "test/mcp/unit/"
          run root        "test/unit/test_*.py test/test_*.py"
          exit $fail
        shell: bash

  # The `unit (mcp)` job above runs the mcp suite against whatever the test
  # requirements happen to resolve -- the `mcp` package arrives TRANSITIVELY
  # via fastmcp's own pin, so cli/setup.py's `[mcp]` extra constraint is
  # never resolved by any check. That is how a widened cap could merge green
  # while `pip install lager-cli[mcp]` breaks at runtime, and it is why
  # dependabot had to ignore mcp majors outright.
  #
  # TWO environments, deliberately. The first is the extra ALONE in a clean
  # venv: the test requirements also pin fastmcp, whose own mcp cap re-narrows
  # the resolution -- observed live on the first cap-widening PR, which ran
  # green here while resolving mcp 1.29.0 under a cap that admitted 2.0. Only
  # an extra-only venv resolves what a real `pip install lager-cli[mcp]` user
  # gets. The probe is GENERATED from the server package's own mcp-SDK
  # imports, so it cannot drift from what the code actually needs (mcp 2.0
  # removed mcp.server.fastmcp -- the probe proves the resolved major still
  # has every surface the server imports). The full server module cannot be
  # imported here: it needs box-runtime deps the extra does not declare
  # (same entanglement class as issue #242).
  #
  # The second environment adds the test requirements and runs the suite --
  # execution-level proof under the resolution the suite supports.
  mcp-extra:
    name: mcp-extra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Prove the extra's own resolution (clean venv)
        run: |
          python -m venv "$RUNNER_TEMP/extra-only"
          "$RUNNER_TEMP/extra-only/bin/pip" install --quiet -e "cli/[mcp]"
          "$RUNNER_TEMP/extra-only/bin/pip" show mcp | grep -E '^(Name|Version)'
          # Probe = every module-level mcp-SDK import in the server package.
          grep -rh '^from mcp\|^import mcp' box/lager/mcp/ | sort -u \
            > "$RUNNER_TEMP/mcp-probe.py"
          # An empty probe would pass vacuously; if the package ever stops
          # importing mcp at module level, this check must be rethought, not
          # silently skipped.
          [ -s "$RUNNER_TEMP/mcp-probe.py" ] || {
            echo "no mcp imports found in box/lager/mcp/ -- probe is vacuous"
            exit 1
          }
          cat "$RUNNER_TEMP/mcp-probe.py"
          "$RUNNER_TEMP/extra-only/bin/python" "$RUNNER_TEMP/mcp-probe.py"
          echo "resolved mcp provides every surface the server imports"
        shell: bash

      - name: Install CLI with the mcp extra + test deps
        run: |
          pip install -e "cli/[mcp]"
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3'
          pip install -r test/requirements-unit.txt
          pip show mcp fastmcp | grep -E '^(Name|Version)'
        shell: bash

      - name: Import the MCP server module
        # box/ is on PYTHONPATH (job env), same as every other suite here.
        # This is the module the lager-mcp console script targets; importing
        # it with the extra's resolution is the minimum liveness proof.
        run: python -c "import lager.mcp.server"
        shell: bash

      - name: Run the mcp unit suite against the extra's resolution
        run: |
          pytest test/mcp/unit/ -q --import-mode=importlib -c /dev/null --timeout=60
        shell: bash

      - name: MCP integration tests still collect
        run: |
          pytest test/mcp/integration/ --collect-only -q \
            --import-mode=importlib -c /dev/null
        shell: bash
