# SPDX-License-Identifier: Apache-2.0
#
# Hardware integration tests for the Lager CLI, run against the shared
# self-hosted "MASTER" bench.
#
# Surfaces: most suites here drive the PYTHON API via `lager python`. The
# J-Link steps additionally run the bash CLI suite, so the debug path is
# covered on both the API and the CLI. The rest of test/integration/*.sh is
# still unwired — a CLI-only regression in those areas (argument parsing,
# output formatting, exit codes) is not yet caught by this workflow.
#
# Lock semantics: `lager python` auto-locks the box at the start of each
# invocation and releases it at the end (see
# docs/source/reference/cli/locking.mdx). The steps here run sequentially in a
# single job, so each instrument test acquires and releases the box lock in
# turn; the final "Best-effort lock cleanup" step is defense-in-depth in case a
# step is killed mid-invocation. The `concurrency` group below serializes whole
# workflow runs (and the update-regression workflow) against the one physical
# bench, so runs queue rather than collide.
#
# Security: this repo is PUBLIC and the runner drives real hardware, so this
# workflow deliberately does NOT trigger on `pull_request` — a fork PR must not
# be able to execute code on the bench.
#
# No cron of its own. Nightly, nightly-bench.yml invokes this workflow behind
# the "Bench: Box Lifecycle" run, so the instruments are exercised against a
# box that was just updated and reinstalled rather than against whatever it
# happened to be running. It also still runs on every push to `main` — a
# per-merge sweep that keeps instrument coverage on nights the lifecycle goes
# red — and on manual dispatch.
#
# Instrument power: the Rigol and Keithley sit on AC relays driven by the
# bench LabJack (see .github/workflows/README.md). This job powers them on
# before the first suite and back off at the end, so the bench is dark
# between runs.

name: "Bench: Integration Tests"

on:
  # Deliberately NO `push:` trigger.
  #
  # Nothing in this workflow deploys to the box -- it only probes with
  # `lager update --check`. The one job that deploys is update-regression.yml's
  # lifecycle, which has no push trigger either, and only nightly-bench.yml
  # chains lifecycle -> integration. So a push-triggered run could never be
  # anything but a run against whatever the last nightly left on the box: the
  # guard below caught it 1, 2, 3, 4 and 8 commits behind on a single afternoon
  # (#326), and every one of those runs was correctly refused.
  #
  # Making push runs meaningful would mean deploying first, and the arithmetic
  # does not work: this suite is ~48 minutes on a bench that serializes, against
  # roughly nine pushes a day. That is ~7 h/day of a resource there is one of,
  # with merges queueing behind each other. A nightly that actually tests a
  # known commit is worth more than nine runs a day that cannot.
  #
  # Feedback latency is therefore up to one night. That is the honest cost of
  # one bench, and it is bounded by dispatching this workflow by hand when a
  # change warrants it -- see "Bench-testing a branch" in README.md.
  workflow_call:
    inputs:
      box_name:
        description: "Lager box name (overrides vars.LAGER_BOX)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      box_name:
        description: "Lager box name (overrides vars.LAGER_BOX)"
        required: false
        type: string

concurrency:
  # One physical bench: serialize whole runs (and update-regression) against it.
  group: hardware-ci-${{ vars.LAGER_BOX || 'MASTER' }}
  cancel-in-progress: false  # never kill a run mid-measurement

# Default token: checkout only. A job that needs more must say so itself.
permissions:
  contents: read

jobs:
  hardware-tests:
    name: Run hardware tests on the bench
    runs-on: [self-hosted, lager-bench]
    # 40 covered the suites alone (green runs span 13-27 min); +5 keeps the
    # relay power-on settle (up to ~3 min) out of the margin.
    timeout-minutes: 45

    env:
      LAGER_BOX: ${{ inputs.box_name || vars.LAGER_BOX || 'MASTER' }}
      # Optional lock tuning (defaults are sensible):
      # LAGER_LOCK_WAIT: '1800'    # seconds to wait on a lock collision
      # LAGER_LOCK_TTL:  '1800'    # seconds the server holds a lock without a heartbeat
      # LAGER_LOCK_HEARTBEAT: '60' # seconds between heartbeat refreshes

    steps:
      - name: Record what triggered this run
        # A run cancelled while queued shows only as `cancelled` in the run
        # list, with no annotation and no notification (see "Concurrency" in
        # README.md). Naming the trigger and ref in the job summary is what
        # makes it possible to tell afterwards WHICH run was displaced, and by
        # what. Cheap, and it costs nothing when nothing goes wrong.
        run: |
          {
            echo "### Run provenance"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Workflow | ${GITHUB_WORKFLOW} |"
            echo "| Triggered by | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Box | \`${LAGER_BOX}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install lager CLI (editable, from this repo)
        run: pip install -e cli/
        shell: bash

      - name: Sign in to the box access gateway
        # The box is fronted by an authenticating gateway. The CLI stores the
        # session in ~/.lager_gateway_auth and silently refreshes it for the
        # rest of the run, so one login covers the whole job.
        env:
          LAGER_AUTH_URL: ${{ vars.LAGER_AUTH_URL }}
          LAGER_CI_EMAIL: ${{ secrets.LAGER_CI_EMAIL }}
          LAGER_CI_PASSWORD: ${{ secrets.LAGER_CI_PASSWORD }}
        run: lager login "$LAGER_AUTH_URL" --email "$LAGER_CI_EMAIL" --password "$LAGER_CI_PASSWORD"
        shell: bash

      - name: Register lager box
        run: |
          lager boxes add \
            --name "$LAGER_BOX" \
            --ip "${{ secrets.LAGER_BOX_IP }}" \
            --user lagerdata \
            --yes
        shell: bash

      - name: Set up lager SSH key
        run: |
          if [ ! -f ~/.ssh/lager_box ]; then
            ssh-keygen -t ed25519 -f ~/.ssh/lager_box -N "" -C "lager-box-access"
          fi
          grep -qF "$(cat ~/.ssh/lager_box.pub)" ~/.ssh/authorized_keys 2>/dev/null || \
            cat ~/.ssh/lager_box.pub >> ~/.ssh/authorized_keys
          # The CLI debug suite shells into the box with the DEFAULT identity
          # (plain `ssh user@host`) to inspect on-box artifacts, so point that
          # identity at the lager key. Both the IP and the box name are mapped:
          # the suite derives the IP from `lager boxes` and falls back to the
          # bare name if that parse comes up empty.
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          if ! grep -q "^# lager integration CI box identity" ~/.ssh/config; then
            {
              echo "# lager integration CI box identity"
              echo "Host ${{ secrets.LAGER_BOX_IP }}"
              echo "  IdentityFile ~/.ssh/lager_box"
              echo "Host $LAGER_BOX"
              echo "  HostName ${{ secrets.LAGER_BOX_IP }}"
              echo "  IdentityFile ~/.ssh/lager_box"
            } >> ~/.ssh/config
          fi
        shell: bash

      - name: Verify box connectivity
        # First authenticated contact after a fresh login can fail exactly once
        # while the gateway records the box<->auth-server link; the retry is
        # then expected to pass.
        run: lager hello --box "$LAGER_BOX" || lager hello --box "$LAGER_BOX"
        shell: bash

      - name: Verify the box is running the ref under test
        # HARD GATE. This used to be `continue-on-error` and nobody read it.
        #
        # `lager python` ships the script to the box and runs it THERE, so a
        # box-side change is exercised from the box's checkout, not the
        # runner's. Only update-regression.yml's lifecycle job updates the
        # box, and only nightly-bench.yml chains lifecycle -> integration. A
        # run whose box was not updated therefore tests whatever was left
        # there, which can be arbitrarily old -- while producing output shaped
        # exactly like a run that tested the commit. The push trigger that made
        # that the normal case is gone (see `on:` above); a hand-dispatched run
        # can still hit it, and this step is what says so.
        #
        # That cost three days of triage: a merged box-side fix was judged a
        # failure from a run whose own probe said the box was 3 commits
        # behind, in a step marked non-fatal. A bench run against a stale box
        # is not evidence about this commit, so reporting it as a pass or a
        # fail is worse than not running.
        #
        # The exit code cannot carry this. `--check` exits 1 for ANY pending
        # change -- deps rebuild, container down, stale deploy, host-CLI
        # drift -- so rc alone cannot distinguish version skew from the rest.
        # Only the `Code:` line does, and its vocabulary is closed:
        # `in sync` / `will update (...)` / `will roll back (...)` /
        # `will switch (...)`.
        #
        # Compared against github.sha -- the COMMIT this run checked out --
        # not against github.ref_name and not against `main` (the CLI's own
        # default).
        #
        # A branch name is re-resolved against origin/<branch> at the moment
        # this step runs, so it is a moving target. The lifecycle job deployed
        # the box minutes earlier; anything merging in between made this step
        # report the box as behind when it was running exactly the commit under
        # test. That cost six of eight bench runs in one afternoon (#326), each
        # burning the full lifecycle job and producing no hardware result.
        # github.sha is fixed for the life of the run, so the question asked is
        # the one meant: "is the box on the commit this run is testing".
        #
        # This requires the lifecycle job to deploy that same commit, which it
        # now does -- see the pinned --version in update-regression.yml. The two
        # jobs must agree on one ref or the gate is meaningless in the other
        # direction. In the nightly chain both jobs are in ONE run, so both read
        # the same github.sha; there is no window for it to move between them.
        #
        # On a bare `workflow_dispatch` of this workflow nothing deploys, so the
        # box must already be on this commit. That is stricter than comparing a
        # branch name, and deliberately so: the error below names the exact
        # command that fixes it.
        #
        # `lager update --version <40-hex sha>` resolves a bare commit as of
        # v0.41.0; before that a SHA fell through to the branch arm and became
        # origin/<sha>, which resolves to nothing. See resolve_version_ref().
        # See "Bench-testing a branch" in README.md.
        env:
          REF: ${{ github.sha }}
        run: |
          rc=0
          out=$(lager update --check --box "$LAGER_BOX" --version "$REF" 2>&1) || rc=$?
          printf '%s\n' "$out"

          # rc 0 = in sync, rc 1 = something would change; both are normal and
          # the `Code:` line below decides. Anything higher means the probe
          # could not run at all -- an unreachable box, or one whose SSH key
          # was never set up, which exits 2 before printing any preview.
          # Annotate rather than exiting on a bare code: this workflow's whole
          # point is that a bench failure should name its own cause.
          if [ "$rc" -gt 1 ]; then
            echo "::error title=Cannot determine box state::lager update --check exited ${rc} against '${LAGER_BOX}' before reporting a preview (box unreachable, or SSH key not set up). No bench result can be trusted until this is fixed."
            exit "$rc"
          fi

          code=$(printf '%s\n' "$out" \
            | tr -d '\r' \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/^[[:space:]]*Code:[[:space:]]*//p' \
            | head -1)

          {
            echo "### Bench box state"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Box | \`${LAGER_BOX}\` |"
            echo "| Commit under test | \`${REF}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Triggered by | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Box code | ${code:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$code" ]; then
            echo "::error title=Box state unknown::lager update --check printed no 'Code:' line, so the box's code cannot be compared against commit ${REF}. Refusing to report a bench result."
            exit 1
          fi

          if [ "$code" != "in sync" ]; then
            echo "::error title=Box is not running the commit under test::Box code is '${code}' against commit ${REF}. A bench run against a stale box is not evidence about this commit. Run Bench: Box Lifecycle (or lager update --box ${LAGER_BOX} --version ${REF}), then re-run."
            exit 1
          fi
        shell: bash

      - name: Ensure relay nets exist (self-heal)
        # People testing on the bench sometimes rebuild the box's nets with
        # `lager nets delete-all` + `add-all`. That wipes the named relay
        # nets (add-all re-fills FIO0/FIO1 as numbered gpio nets) and
        # recreates the default LabJack SPI net on FIO0-FIO3, whose CS/SCK
        # lines ARE the relay controls. Heal here instead of failing the
        # night: rename the squatter net back (preserves its record),
        # create the net fresh when the pin is empty, and delete any SPI
        # net overlapping the relay pins. Hard gate — if this cannot be
        # healed, the power-on step below could not work either.
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          box = os.environ["LAGER_BOX"]

          def lager(*args, parse=False):
              res = subprocess.run(["lager", *args, "--box", box],
                                   capture_output=True, text=True)
              if res.returncode != 0:
                  print(res.stdout + res.stderr)
                  sys.exit(f"lager {' '.join(args)} failed (rc {res.returncode})")
              return json.loads(res.stdout) if parse else res.stdout

          nets = lager("nets", "state", "--json", parse=True)
          names = {n.get("name") for n in nets}

          def labjack_address():
              for n in nets:
                  if "0x0CD5" in str(n.get("address", "")):
                      return n["address"]
              out = lager("instruments")
              m = re.search(r"USB0::0x0CD5::0x0007::[^:\s]*::INSTR", out)
              if not m:
                  sys.exit("cannot determine the LabJack VISA address")
              return m.group(0)

          for want, pin in ((os.environ["RIGOL_POWER_NET"], "FIO0"),
                            (os.environ["KEITHLEY_POWER_NET"], "FIO1")):
              if want in names:
                  print(f"{want} present")
                  continue
              squatter = next((n["name"] for n in nets
                               if n.get("role") == "gpio"
                               and n.get("pin") == pin), None)
              if squatter:
                  lager("nets", "rename", squatter, want)
                  print(f"renamed {squatter} -> {want} ({pin})")
              else:
                  lager("nets", "add", want, "gpio", pin, labjack_address())
                  print(f"created {want} on {pin}")

          for n in nets:
              if n.get("role") == "spi" and re.search(r"\bFIO[01]\b", json.dumps(n)):
                  lager("nets", "delete", n["name"], "spi", "--yes")
                  print(f"deleted SPI net {n['name']} - overlaps the relay pins")
          PY
        shell: bash

      - name: Power on bench instruments (AC relays)
        # The Rigol DP821 and Keithley 2281S sit on AC power relays driven by
        # the bench LabJack (control high = outlet on); the bench is dark
        # between runs. Power both up and wait until both enumerate on the
        # box's USB scan before any suite talks to them. The driven level
        # latches in LabJack hardware, so nothing needs to stay alive to hold
        # it. `lager instruments` reads the box's USB scan only (no VISA
        # session, no box lock) and exits non-zero on transient connectivity
        # errors — hence `|| true` per attempt. Fast no-op when the
        # instruments are already up (e.g. right behind the lifecycle run in
        # the nightly chain). No continue-on-error and no `id:` — if the
        # instruments cannot be powered, failing here beats seven suites
        # failing one by one.
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
          PROBE_SUPPLY_NET: ${{ vars.RIGOL_CH1_NET || 'supply2' }}
        run: |
          lager gpo "$RIGOL_POWER_NET" high --box "$LAGER_BOX"
          lager gpo "$KEITHLEY_POWER_NET" high --box "$LAGER_BOX"
          # EVERY instrument on the relays has to finish enumerating before any
          # suite runs -- not just the ones a suite talks to. A device that is
          # still coming up when this step returns hotplugs later, and the
          # hotplug restarts the box's hardware service underneath whatever is
          # already running.
          #
          # Measured from a dark relay: DP821 6s, Keithley 2281S 11s, Rigol
          # MSO5204 52s and 60s across two runs. The MSO5204 shares the
          # RIGOL_POWER outlet, so waiting only for the first two returned
          # about 35s before it had finished, and a command issued in that
          # window came back `Connection refused` on localhost:8080 --
          # reproduced deliberately on the bench, not inferred.
          #
          # This list is the bench's actual relay-powered inventory, so adding
          # an instrument to a relay means adding it here. An entry that is
          # genuinely gone fails this step BY NAME after 180s, which is the
          # outcome we want: the bench changed and the workflow should say so
          # rather than quietly race whatever is left.
          expected=(Rigol_DP821 Keithley_2281S Rigol_MSO5204)
          enumerated=""
          missing=""
          for _ in $(seq 1 36); do
            out=$(lager instruments --box "$LAGER_BOX" 2>/dev/null || true)
            missing=""
            for inst in "${expected[@]}"; do
              printf '%s' "$out" | grep -q "$inst" || missing="$missing $inst"
            done
            if [ -z "$missing" ]; then
              enumerated=1
              break
            fi
            sleep 5
          done
          if [ -z "$enumerated" ]; then
            echo "Did not enumerate within 180s of relay power-on:$missing"
            exit 1
          fi
          echo "All relay-powered instruments enumerated."
          # Enumeration is not readiness: the USB hotplug from the relay
          # power-on restarts the box's hardware service, and supply
          # connections are refused for a few seconds after the instruments
          # appear (observed live: two Rigol suites failed inside that window
          # while everything after passed). Poll an actual supply read until
          # the service answers before letting any suite run.
          for _ in $(seq 1 24); do
            if lager supply "$PROBE_SUPPLY_NET" state --box "$LAGER_BOX" >/dev/null 2>&1; then
              echo "Hardware service is answering supply reads."
              exit 0
            fi
            sleep 5
          done
          echo "Hardware service did not answer supply reads within 120s of power-on"
          exit 1
        shell: bash

      - name: Stage debug firmware
        # The debug suites SELF-SKIP when no firmware is present and record
        # those skips as PASS, so a firmware that never arrives would leave the
        # nightly green with zero flash coverage. Assert it instead of trusting
        # the skip. Base64-in-a-secret is the same staging pattern already used
        # to put this hex on a box; it keeps this PUBLIC repo binary-free and
        # survives a box reimage.
        env:
          FW_B64: ${{ secrets.LAGER_DEBUG_FIRMWARE_HEX }}
        run: |
          if [ -z "$FW_B64" ]; then
            echo "LAGER_DEBUG_FIRMWARE_HEX is not set."
            echo "Refusing to run debug tests that would silently self-skip"
            echo "and report green. Set the secret or drop the debug steps."
            exit 1
          fi
          printf '%s' "$FW_B64" | base64 -d > "$RUNNER_TEMP/firmware.hex"
          # Intel HEX records all start with ':'. Catches a truncated or
          # double-encoded secret before it reaches the probe.
          head -1 "$RUNNER_TEMP/firmware.hex" | grep -q '^:' || {
            echo "staged file is not Intel HEX"; exit 1; }
          # The CLI suite resolves its firmware argument relative to its
          # invocation directory, so keep a copy in the workspace too.
          cp "$RUNNER_TEMP/firmware.hex" firmware.hex
          echo "staged $(wc -c < firmware.hex) bytes of Intel HEX"
        shell: bash

      # Zero-hardware API checks go first: they need no instrument and no
      # relay, so they answer in seconds. If the box-side Python API is not
      # answering at all, these say so before eight minutes of instrument
      # timeouts do. Neither script reads an env var, so neither needs a
      # --passenv — the rule below still applies to every step after these.
      - name: Test net listing (Python API)
        id: list-nets-test
        continue-on-error: true
        timeout-minutes: 5
        run: |
          lager python test/api/utility/test_list_nets.py --box "$LAGER_BOX"
        shell: bash

      - name: Test custom binaries (Python API)
        id: custom-binaries-test
        continue-on-error: true
        timeout-minutes: 5
        run: |
          lager python test/api/utility/test_custom_binaries.py --box "$LAGER_BOX"
        shell: bash

      # `lager python` runs the script ON THE BOX and forwards environment
      # only through explicit --env/--passenv — a step-level `env:` block
      # alone never reaches the box-side script, which then silently runs on
      # its built-in defaults. That stayed invisible for as long as every
      # fallback here textually matched every script default; the GPIO_NET
      # repoint was the first divergence and failed on exactly this. Every
      # `lager python` step therefore --passenv's the vars it sets.
      - name: Test Rigol DP821 CH1 (60V / 1A)
        id: rigol-ch1-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          SUPPLY_NET: ${{ vars.RIGOL_CH1_NET || 'supply2' }}
          CHANNEL_MAX_VOLTAGE: ${{ vars.RIGOL_CH1_MAX_VOLTAGE || '60.0' }}
          CHANNEL_MAX_CURRENT: ${{ vars.RIGOL_CH1_MAX_CURRENT || '1.0' }}
        run: |
          lager python test/api/power/test_supply_Rigol_DP821.py --box "$LAGER_BOX" \
            --passenv SUPPLY_NET --passenv CHANNEL_MAX_VOLTAGE --passenv CHANNEL_MAX_CURRENT
        shell: bash

      - name: Test Rigol DP821 CH2 (8V / 10A)
        id: rigol-ch2-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          SUPPLY_NET: ${{ vars.RIGOL_CH2_NET || 'supply3' }}
          CHANNEL_MAX_VOLTAGE: ${{ vars.RIGOL_CH2_MAX_VOLTAGE || '8.0' }}
          CHANNEL_MAX_CURRENT: ${{ vars.RIGOL_CH2_MAX_CURRENT || '10.0' }}
        run: |
          lager python test/api/power/test_supply_Rigol_DP821.py --box "$LAGER_BOX" \
            --passenv SUPPLY_NET --passenv CHANNEL_MAX_VOLTAGE --passenv CHANNEL_MAX_CURRENT
        shell: bash

      - name: Test LabJack T7 (ADC / DAC / GPIO)
        id: labjack-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          ADC_NET: ${{ vars.ADC_NET || 'adc1' }}
          DAC_NET: ${{ vars.DAC_NET || 'dac1' }}
          # NOT gpio16/gpio17 (FIO0/FIO1): those pins drive the bench's AC
          # power relays — the test toggles the pin and leaves it LOW, which
          # would cut an instrument's power mid-run. gpio18 = FIO2.
          GPIO_NET: ${{ vars.GPIO_NET || 'gpio18' }}
          ADC_NETS: ${{ vars.ADC_NETS || 'adc1,adc2,adc3' }}
          LOOPBACK_ADC_NET: ${{ vars.LOOPBACK_ADC_NET || 'adc1' }}
        run: |
          lager python test/api/io/test_LabJack_T7.py --box "$LAGER_BOX" \
            --passenv ADC_NET --passenv DAC_NET --passenv GPIO_NET \
            --passenv ADC_NETS --passenv LOOPBACK_ADC_NET
        shell: bash

      - name: Test Acroname USB Hub
        id: acroname-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          USB_NET: ${{ vars.USB_NET || 'usb1' }}
          USB_NETS: ${{ vars.USB_NETS || 'usb1' }}
          # Diagnostic only, for #277. The suite passes 9/9 standalone on this
          # bench but aborts here most runs, so the difference is the CI
          # context rather than the test -- which means the trace has to be
          # collected from a real run, not a hand-run reproduction.
          LAGER_HUB_EXIT_DEBUG: "1"
        run: |
          lager python test/api/usb/test_Acroname.py --box "$LAGER_BOX" \
            --passenv USB_NET --passenv USB_NETS \
            --passenv LAGER_HUB_EXIT_DEBUG
        shell: bash

      - name: Test Keithley 2281S power supply
        id: keithley-supply-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          KEITHLEY_SUPPLY_NET: ${{ vars.KEITHLEY_SUPPLY_NET || 'supply1' }}
          KEITHLEY_MAX_VOLTAGE: ${{ vars.KEITHLEY_MAX_VOLTAGE || '20.0' }}
          KEITHLEY_MAX_CURRENT: ${{ vars.KEITHLEY_MAX_CURRENT || '6.0' }}
        run: |
          lager python test/api/power/test_supply_Keithley_2281S.py --box "$LAGER_BOX" \
            --passenv KEITHLEY_SUPPLY_NET --passenv KEITHLEY_MAX_VOLTAGE \
            --passenv KEITHLEY_MAX_CURRENT
        shell: bash

      - name: Test Keithley 2281S battery simulator
        id: keithley-battery-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          KEITHLEY_BATTERY_NET: ${{ vars.KEITHLEY_BATTERY_NET || 'battery1' }}
        run: |
          lager python test/api/power/test_battery_Keithley_2281S.py --box "$LAGER_BOX" \
            --passenv KEITHLEY_BATTERY_NET
        shell: bash

      - name: Test MCC USB-202 (ADC / DAC / GPIO)
        id: usb202-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          ADC_NETS: ${{ vars.USB202_ADC_NETS || 'adc15,adc16,adc17,adc18,adc19,adc20,adc21,adc22' }}
          DAC_NETS: ${{ vars.USB202_DAC_NETS || 'dac3,dac4' }}
          GPIO_NETS: ${{ vars.USB202_GPIO_NETS || 'gpio24,gpio25,gpio26,gpio27,gpio28,gpio29,gpio30,gpio31' }}
          SUPPLY_NET: ${{ vars.USB202_SUPPLY_NET || '' }}
          SUPPLY_VOLTAGE: ${{ vars.USB202_SUPPLY_VOLTAGE || '3.3' }}
          SUPPLY_ADC_NET: ${{ vars.USB202_SUPPLY_ADC_NET || '' }}
          LABJACK_ADC_NET: ${{ vars.USB202_LABJACK_ADC_NET || '' }}
          GPIO_LOOPBACK_OUT: ${{ vars.USB202_GPIO_LOOPBACK_OUT || '' }}
          GPIO_LOOPBACK_IN: ${{ vars.USB202_GPIO_LOOPBACK_IN || '' }}
        run: |
          lager python test/api/io/test_usb202.py --box "$LAGER_BOX" \
            --passenv ADC_NETS --passenv DAC_NETS --passenv GPIO_NETS \
            --passenv SUPPLY_NET --passenv SUPPLY_VOLTAGE --passenv SUPPLY_ADC_NET \
            --passenv LABJACK_ADC_NET --passenv GPIO_LOOPBACK_OUT --passenv GPIO_LOOPBACK_IN
        shell: bash

      # J-Link goes last: it spawns JLinkGDBServer and holds the probe's USB
      # interface, so a hung probe here cannot mask the other instruments.
      # Both surfaces are covered — the Python API via `lager python`, and the
      # CLI via the bash suite. Every other hardware assertion in this workflow
      # goes through the Python API only.

      - name: Test J-Link debug net (Python API)
        id: debug-api-test
        continue-on-error: true
        timeout-minutes: 10
        env:
          DEBUG_NET: ${{ vars.DEBUG_NET || 'debug1' }}
          FIRMWARE_PATH: firmware.hex
          ALLOW_ERASE: "0"  # never chip-erase the bench target
        run: |
          lager python test/api/communication/test_debug_comprehensive.py \
            --box "$LAGER_BOX" --add-file "$RUNNER_TEMP/firmware.hex" \
            --passenv DEBUG_NET --passenv FIRMWARE_PATH --passenv ALLOW_ERASE
        shell: bash

      - name: Test J-Link flash to RTT round trip (Python API)
        id: debug-rtt-test
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBUG_NET: ${{ vars.DEBUG_NET || 'debug1' }}
          FIRMWARE_PATH: firmware.hex
        run: |
          lager python test/api/communication/test_debug_rtt_blink.py \
            --box "$LAGER_BOX" --add-file "$RUNNER_TEMP/firmware.hex" \
            --passenv DEBUG_NET --passenv FIRMWARE_PATH
        shell: bash

      - name: Test J-Link script file (CLI)
        # Gated on a BASELINE, not on raw pass/fail.
        #
        # Gating on raw pass/fail would keep the nightly permanently red;
        # dropping the `id:` reported a bare green tick that could not be told
        # apart from new breakage or from the suite dying on its first line. So
        # instead: tolerate the documented failure count, fail if it GROWS, and
        # fail if no summary was produced at all. The count is surfaced as a
        # run annotation either way. Keep this wrapper even at baseline 0 — the
        # "no parseable summary" arm is what catches a suite that dies before
        # reporting.
        #
        # Baseline history:
        #   24 -> 4  the debug CLI began sending an Authorization header, so
        #            box-contacting checks stopped failing on auth first.
        #    4 -> 6  NOT a regression -- the number went UP because the checks
        #            got honest. 4.2/4.3 and smoke 2/3/4 matched loose keywords
        #            against combined stdout+stderr, so the CLI's own failure
        #            text ("Verify target device is powered on") satisfied a
        #            check looking for "Device"; smoke step 2 called
        #            track_test "pass" in both arms. Those recorded passes
        #            while printing failures. Tightening them converts four
        #            false passes into two visible failures (the other two now
        #            pass legitimately).
        #    6 -> 0  the flash/post-erase connect defect below stopped
        #            reproducing on the bench; consecutive nightly runs report
        #            0 failures, so the ratchet locks the clean state in.
        #
        # Measured on a real bench from a known-good target -- the precondition
        # matters, because a failed flash leaves the chip erased and every
        # later connect on that net then fails for the same reason, which
        # inflates the count on any rerun that starts dirty.
        #
        # The 6 tracked before the drop to 0 were one defect and its blast
        # radius: `flash` erases, then its post-erase `/debug/connect` answers
        # 500 ("Failed to power up DAP"), so section 4 lost all five checks
        # and smoke lost its flash. Tracked separately -- that was a different
        # bug from the net-blind status check fixed here.
        #
        # This value must move in the SAME commit as the assertion repairs;
        # lowering it separately would trip the `-gt` arm.
        id: debug-cli-test
        continue-on-error: true
        timeout-minutes: 15
        env:
          # The suite defaults to ssh user `lager`; this bench logs in as
          # `lagerdata`.
          SSH_USER: lagerdata
          JLINK_CLI_BASELINE: "0"
        # Pass the box NAME, not the IP: given an IP the suite registers a
        # `temp_box_<ip>` entry, polluting the box list the lifecycle workflow
        # also manages.
        run: |
          LOG="$RUNNER_TEMP/jlink-cli.log"
          rc=0
          bash test/integration/communication/jlink_script.sh \
            "$LAGER_BOX" "${{ vars.DEBUG_NET || 'debug1' }}" firmware.hex \
            2>&1 | tee "$LOG" || rc=$?

          # Strip ANSI so the summary parses regardless of colour output, then
          # address the columns by position rather than by $NF. harness.sh
          # print_summary emits
          #   TOTAL  <total> <passed> <failed>
          # with an EMPTY description cell, and appends a fifth <excluded>
          # column whenever GLOBAL_EXCLUDED > 0 -- which any track_test "skip"
          # triggers (jlink_script.sh skips both flash sections when the hex
          # file is missing). `$NF` therefore read the SKIP count on exactly
          # those runs, letting the ratchet pass with an arbitrary number of
          # real failures.
          read -r total failed <<<"$(sed 's/\x1b\[[0-9;]*m//g' "$LOG" \
            | awk '$1 == "TOTAL" && NF >= 4 {print $2, $4}' | tail -1)"

          if ! printf '%s' "$failed" | grep -qE '^[0-9]+$' \
            || ! printf '%s' "$total" | grep -qE '^[0-9]+$'; then
            echo "::error title=J-Link CLI::suite produced no parseable summary (exit $rc) - it likely died before reporting"
            exit 1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "::notice title=J-Link CLI::all $total checks pass"
          else
            echo "::warning title=J-Link CLI suite::$failed of $total checks fail (baseline $JLINK_CLI_BASELINE)"
          fi

          if [ "$failed" -gt "$JLINK_CLI_BASELINE" ]; then
            echo "::error title=J-Link CLI::failures grew from $JLINK_CLI_BASELINE to $failed - new breakage beyond the known gap"
            exit 1
          fi

          if [ "$failed" -lt "$JLINK_CLI_BASELINE" ]; then
            echo "::notice title=J-Link CLI::only $failed failures (baseline $JLINK_CLI_BASELINE) - lower JLINK_CLI_BASELINE to lock in the improvement"
          fi
        shell: bash

      - name: Fail job if any test failed
        # Every instrument step is continue-on-error so all instruments get
        # exercised in one run; this gate turns any failure into a job failure.
        #
        # It reads the `steps` context rather than enumerating step ids, so
        # adding an instrument needs no edit here. The previous hand-kept list
        # named all seven ids twice — in the `if:` and again in the echo block —
        # and omitting one from the `if:` would have turned a failing instrument
        # into a silently green job. Steps deliberately left without an `id`
        # (the best-effort cleanup and power-off steps) remain non-fatal. The
        # box-state gate above is also id-less, but it is NOT continue-on-error
        # -- it fails the job directly, before any instrument is touched.
        #
        # `outcome`, not `conclusion`: outcome is the result BEFORE
        # continue-on-error is applied. No `if:` key, so — as before — this
        # gate is skipped when an earlier non-continue-on-error step has
        # already failed the job.
        env:
          # Passed via env, never interpolated into the script body.
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          steps = json.loads(os.environ["STEPS_JSON"])
          bad = sorted(k for k, v in steps.items()
                       if isinstance(v, dict) and v.get("outcome") == "failure")
          if bad:
              print("One or more hardware tests failed:")
              for name in bad:
                  print(f"  {name}")
              sys.exit(1)
          print("All instrument suites passed.")
          PY
        shell: bash

      - name: Best-effort J-Link cleanup
        # A debug step killed mid-session can leave JLinkGDBServer holding the
        # probe, which would fail the NEXT night's connect. Tear the session
        # down explicitly rather than relying on the process exiting.
        #
        # `|| true` guards the exit code, not the wall clock: this step ran for
        # 20 minutes after the suite had already timed out (#322), holding the
        # serialized `hardware-ci-*` group against every other bench workflow.
        # Bound it, and keep the step best-effort under that bound so a slow
        # disconnect cannot turn a green run red.
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        env:
          DEBUG_NET: ${{ vars.DEBUG_NET || 'debug1' }}
        run: lager debug "$DEBUG_NET" disconnect --box "$LAGER_BOX" 2>/dev/null || true
        shell: bash

      - name: Best-effort lock cleanup
        # Defense in depth: if a step was killed in a way that bypassed the
        # CLI's release hook, force-release the lock so it doesn't sit until
        # the server TTL. The same-holder check on the box prevents stomping
        # another holder's live lock.
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: lager boxes unlock --box "$LAGER_BOX" 2>/dev/null || true
        shell: bash

      - name: Power off bench instruments (AC relays)
        # Dark-bench policy: leave the Rigol and Keithley unpowered between
        # runs. Best-effort — a power-off hiccup must not turn a green run
        # red, and the next run's power-on step re-asserts the state anyway.
        # No `id:`, so the fail gate above never sees this step.
        #
        # Bounded in the shell, not by `timeout-minutes` alone. If this step is
        # killed by its step bound it prints nothing, and `continue-on-error`
        # then renders it as a green tick that is indistinguishable from a bench
        # that actually went dark -- while the relays stay latched on and the
        # next thing to touch that bench is a person. Bounding each net here
        # leaves the shell alive to say so, and means one wedged relay no longer
        # eats the whole step budget before the other net is even tried.
        # `timeout-minutes` stays as the backstop for a wedged shell.
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          RIGOL_POWER_NET: ${{ vars.RIGOL_POWER_NET || 'RIGOL_POWER' }}
          KEITHLEY_POWER_NET: ${{ vars.KEITHLEY_POWER_NET || 'KEITHLEY_POWER' }}
        run: |
          for net in "$RIGOL_POWER_NET" "$KEITHLEY_POWER_NET"; do
            rc=0
            timeout 50 lager gpo "$net" low --box "$LAGER_BOX" || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning title=Bench may still be energized::'$net' did not go low within 50s on '$LAGER_BOX'. Assume the relay is latched on and the instrument is idling at AC."
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Bench may still be energized::'$net' low failed (exit $rc) on '$LAGER_BOX'. Assume the relay is latched on and the instrument is idling at AC."
            fi
          done
          exit 0
        shell: bash
