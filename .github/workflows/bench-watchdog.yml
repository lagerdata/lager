#
# Detects the bench failure the notify jobs in nightly-bench.yml structurally
# cannot: the night that never runs. A workflow that never starts has no
# failing job to notify from, so a dead self-hosted runner leaves runs QUEUED
# forever, silently. That is the observed failure mode this watches for --
# checking the runner's own online status via the API would need
# administration:read, which GITHUB_TOKEN cannot hold, so this reads run
# history instead and needs no standing credential.
#
# Five checks against nightly-bench.yml's recent runs:
#   queued    runner offline (the nightly chain's own budget is well under the
#             threshold, and nothing else shares the bench queue slot for hours)
#   running   stuck run (lifecycle 90m + integration 45m timeouts mean a
#             healthy night can never reach it)
#   stale     nothing scheduled at all for over a day -- the cron is dead. The
#             backstop nothing else provides: with no further run there is
#             never another gap or lateness sample.
#   gap       an interval so large a night was certainly skipped. Set well
#             above nominal on purpose, because a merely late night is
#             lateness, not a miss.
#   lateness  mean delay against the cron declared in nightly-bench.yml. This
#             is the leading indicator; spacing self-corrects and hides the
#             decay, lateness does not.
#
# EVERY threshold lives in tools/bench_schedule_check.py, with its reasoning,
# and is NOT set here. This block used to carry its own copy: it kept a stale
# `SCHEDULE_DRIFT_WARN_HOURS` that the tool had stopped reading, and it
# overrode the gap threshold with a value below the tool's, which alarmed on a
# 26.7h night that was late rather than missed. A value declared in one file
# and consumed in another, with nothing asserting they agree, is the same
# defect this whole watchdog exists to catch. test_bench_watchdog_env.py now
# fails if a threshold name reappears here that the tool does not read.
#
# Alerts land on the same single `bench-alert` issue the nightly notify jobs
# use (tools/bench_alert.sh), so one bench incident reads as one issue no
# matter which watcher saw it first. The watchdog never closes the issue --
# only a fully green nightly does, because "runs are flowing again" is not
# the same claim as "the bench is healthy".
#
# Honest residual: this is itself a scheduled workflow. GitHub disables crons
# in repos with no activity for 60 days, which would kill the watchdog and the
# nightly together. Accepted -- this repo has steady activity, and a watchdog
# for the watchdog has no end.

name: "Bench: Watchdog"

on:
  schedule:
    # Off the hour for the same scheduled-queue reason as nightly-bench.yml.
    # Every 6h bounds detection latency to ~6h (the 2026-08 outage ran 8 days
    # unnoticed); more often adds noise risk during GitHub-side incidents,
    # not signal.
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    name: bench watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Check that nightly bench runs are flowing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # Two queries, because they answer different questions.
          #
          # Run health needs recent runs of every event: a dispatch can be the
          # one stuck on an offline runner.
          gh run list --repo "$GH_REPO" --workflow nightly-bench.yml \
            --limit 20 --json databaseId,status,createdAt,event > runs.json
          # Cadence needs scheduled runs only, and filtered SERVER-side. The
          # old check read the same 20 mixed runs, so a burst of manual
          # dispatches could evict every scheduled run from the window and
          # degrade the alert to "no scheduled nightly run in the last 20
          # runs" -- which says nothing about the cron.
          gh api \
            "repos/$GH_REPO/actions/workflows/nightly-bench.yml/runs?event=schedule&per_page=10" \
            --jq '[.workflow_runs[] | {databaseId: .id, status, createdAt: .created_at, event}]' \
            > scheduled.json

          # The arithmetic lives in tools/bench_schedule_check.py so it can be
          # tested -- test/unit/test_bench_schedule_check.py. It was wrong here
          # for as long as it was untestable here.
          #
          # Exit codes are load-bearing: 0 healthy, 1 problems found, >1 the
          # check itself could not run. This shell runs under `-e`, so an
          # unguarded call would abort the step on 1 and skip the alerting
          # below -- the watchdog would go silent at exactly the moment it had
          # something to say. Anything above 1 must still fail loudly rather
          # than be read as "no problems".
          rc=0
          python3 tools/bench_schedule_check.py runs.json scheduled.json || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "Watchdog check could not run (exit $rc) - this is not a green bench."
            exit "$rc"
          fi

          # Lateness is measured but never paged on -- see WHY LATENESS IS
          # REPORT-ONLY in tools/bench_schedule_check.py. It goes in the run
          # summary on every run, including green ones, so the trend stays
          # visible to anyone who looks without filing anything.
          if [ -f warnings.txt ]; then
            {
              echo "### Bench schedule warnings"
              echo
              cat warnings.txt
              echo
              echo "Reported, not alerted: the delay is GitHub's scheduled-event"
              echo "queue and nothing in this repository can bound it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f problems.txt ]; then
            {
              echo "Bench watchdog found nightly runs not flowing:"
              echo
              cat problems.txt
              if [ -f warnings.txt ]; then
                echo
                echo "Also observed, though not itself the reason for this alert:"
                echo
                cat warnings.txt
              fi
              echo
              echo "Detected by: ${RUN_URL}"
              echo "First checks: is the self-hosted runner service alive on the"
              echo "bench box, and does the Actions tab show nightly-bench.yml"
              echo "still scheduled? This issue closes automatically on the next"
              echo "fully green nightly."
            } > "$RUNNER_TEMP/alert-body.md"
            bash tools/bench_alert.sh alert "Nightly bench is failing" "$RUNNER_TEMP/alert-body.md"
            exit 1
          fi
        shell: bash
