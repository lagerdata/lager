#
# Cheap, hardware-free checks over the parts of the tree the unit-test gate
# cannot reach.
#
# unit-tests.yml runs pytest over test/unit/, test/mcp/unit/ and cli/tests/.
# That leaves large areas with no automated validation at all:
#
#   test/integration/  38 bash scripts, run against a real box
#   test/manual/        2 bash scripts
#   test/framework/     2 bash scripts, sourced by all 38 integration scripts
#   test/api/          81 standalone Python scripts, only 6 of which any
#                      workflow invokes -- the other 75 run nowhere
#
# None of it can execute on a hosted runner, but all of it can be checked for
# syntax, and the shell can be linted. A typo in an integration script
# currently surfaces only when someone runs it against the bench.
#
# Every check here was green on the tree when the workflow was added, so a red
# run means the change under review broke something -- not that the baseline
# was already dirty.

# Display name only — the `static-checks` JOB name below is pinned as a
# required context in the main branch ruleset; never rename it.
name: "PR Gate: Static Checks"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default token: checkout only. A job that needs more must say so itself.
permissions:
  contents: read

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          pip install -e cli/
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3' 'ruff==0.16.0'
          # Pinned, and deliberately NOT the runner image's shellcheck. The
          # step below is now a real gate at -S warning, and its exclusion list
          # is justified by exact per-code counts -- both of which are only
          # meaningful against a known version. Taking whatever the image ships
          # would let a GitHub image bump turn this red with no repo change,
          # which is the same failure this PR pins requirements-unit.txt against.
          pip install 'shellcheck-py==0.11.0.1'
          # Workflow linters, pinned for the same reason. zizmor's baselines
          # (.github/zizmor.yml) and actionlint's runner labels
          # (.github/actionlint.yaml) were measured against these versions.
          pip install 'zizmor==1.29.0' 'actionlint-py==1.7.12.24'
          pip install -r test/requirements-unit.txt
        shell: bash

      # Assert the pinned binary actually won on PATH. `pip install
      # shellcheck-py` must shadow /usr/bin/shellcheck from the image; if it
      # ever does not, fail loudly here rather than silently linting with a
      # different version than the counts above were measured on.
      - name: Verify pinned shellcheck is on PATH
        run: |
          shellcheck --version
          shellcheck --version | grep -qx 'version: 0.11.0' || {
            echo "Expected shellcheck 0.11.0 (from shellcheck-py==0.11.0.1); got the above."
            echo "which shellcheck: $(which shellcheck)"
            exit 1
          }
        shell: bash

      # The workflows themselves are code that gates everything else, so they
      # get linted too. zizmor audits for the classes of workflow bug that
      # have real security or correctness consequences (unpinned actions,
      # excessive token permissions, injection surfaces); offline mode keeps
      # this deterministic -- no API dependency in a required job. Findings
      # at `low` and above fail; deliberate exceptions live in
      # .github/zizmor.yml with their reasons.
      - name: zizmor (workflow audit)
        if: always()
        run: |
          zizmor --no-online-audits --min-severity low \
            --config .github/zizmor.yml .github/workflows/
        shell: bash

      # Syntax/semantics for the workflow files: expression typos, bad
      # `needs:` references, unknown runner labels (custom bench labels are
      # declared in .github/actionlint.yaml). Its shellcheck/pyflakes
      # integrations are disabled: embedded run-blocks are already covered at
      # this repo's own chosen floors by the steps in this job, and a second
      # tool applying DIFFERENT floors to the same scripts would make the
      # gate's level ambiguous.
      - name: actionlint (workflow syntax)
        if: always()
        run: actionlint -shellcheck= -pyflakes=
        shell: bash

      - name: Bash syntax (bash -n)
        if: always()
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find test -name '*.sh')
          exit $fail
        shell: bash

      # -S warning, with a named exclusion list. Previously -S error (0
      # findings); -S warning was 181, of which 91 are now fixed:
      #
      #   SC2069  76  `cmd 2>&1 >/dev/null` sent stderr to the terminal
      #               instead of discarding it. Swapped to `>/dev/null 2>&1`.
      #               Exit status was never affected, so no test changes result.
      #   SC2034  33  `for i in ...` loops whose body never reads the counter,
      #               renamed to `for _`. Note 33 fixes only moved the reported
      #               count 45 -> 30: shellcheck reports SC2034 once per name
      #               per scope, so a file with five unread `i` loops counts as
      #               one finding until you fix it and the next one surfaces.
      #               Do not read a raw finding count as a backlog size.
      #
      # The five excluded codes are the remaining 90. They are excluded HERE,
      # by name, rather than with inline `# shellcheck disable` comments,
      # because a disable directive cannot be scoped to a single variable: it
      # silences that code for the rest of the file (verified), so 90 inline
      # suppressions would blind 20 files to everything that came after. A
      # named list is countable, lives in one place, and each code switches
      # back on by deleting it from the list.
      #
      #   SC2320  39  `$?` reads echo/printf's status, not the command's.
      #   SC2034 ~17  Intentional constants only (BMP280/BME280 register maps,
      #               TEST_DELAY knobs, a color fallback). The ~13 captured-
      #               then-ignored values that used to share this bucket now
      #               assert (or were deleted) -- see test/COVERAGE.md.
      #               Retiring the code entirely needs per-file disables for
      #               the constants; ratchet follow-up.
      #   SC2155  16  `local x=$(cmd)` masks the command's return value.
      #   SC2164   4  `cd` without `|| exit`.
      #   SC2046   1  Unquoted command substitution.
      #
      # All 90 are in test/integration/ and test/manual/, which no workflow
      # executes -- a fix cannot be proven here, only on the bench. They are
      # tracked as a bench task rather than churned blind.
      - name: 'ShellCheck (severity: warning)'
        if: always()
        run: |
          shellcheck -S warning \
            -e SC2034,SC2320,SC2155,SC2164,SC2046 \
            -f gcc $(find test -name '*.sh')
        shell: bash

      # test/api/ is 81 standalone scripts, not pytest (see test/CONVENTIONS.md),
      # so --collect-only cannot reach them and a real import needs the box
      # hardware stack. Compiling catches syntax errors and nothing else, which
      # is still strictly more than the zero coverage they have today.
      - name: Python syntax (compileall)
        if: always()
        run: python -m compileall -q cli box test tools
        shell: bash

      # This one IS pytest, and test/mcp/conftest.py already handles sys.path
      # and markers -- so proving it imports without hardware is a real check.
      - name: MCP integration tests import cleanly
        if: always()
        run: |
          pytest test/mcp/integration/ --collect-only -q \
            --import-mode=importlib -c /dev/null
        shell: bash

      # test/COVERAGE.md opens with "Counts here are checked against disk", and
      # until now nothing checked it. It drifted three times in one afternoon --
      # two merges added 37 gated tests between them without touching the file,
      # leaving it understating the gate by 290. An unverified number still
      # reads as authoritative, which makes it worse than no number.
      #
      # This runs each suite and compares against the table. It means a PR that
      # adds or removes a test must update COVERAGE.md -- which is already the
      # rule the file states, now enforced. `--fix` rewrites the table.
      - name: COVERAGE.md counts match reality
        if: always()
        run: python tools/check_coverage_counts.py
        shell: bash

      # Errors only: undefined names, syntax errors, f-string and assert
      # mistakes. Not style. The full default ruleset reports ~6300 findings on
      # this tree, which would be noise, not a gate. Vendored trees are
      # excluded -- they are third-party code we do not edit.
      - name: Ruff (errors only)
        if: always()
        run: |
          ruff check --select E9,F63,F7,F82 \
            --exclude cli/vendor \
            cli/ box/ test/ tools/
        shell: bash

  # Reporting only -- no threshold, and deliberately not a required check.
  # A coverage number is useful for spotting which modules the gate never
  # touches; failing a PR on a percentage punishes unrelated work.
  coverage:
    name: coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/box
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install CLI + test deps
        run: |
          pip install -e cli/
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3' 'pytest-cov>=5,<8'
          pip install -r test/requirements-unit.txt
        shell: bash

      # Each suite is a separate pytest process (they need incompatible
      # sys.modules states for `lager` -- see unit-tests.yml), so coverage is
      # collected in append mode across all six and combined at the end.
      - name: Run suites under coverage
        run: |
          set -x
          COV="--cov=cli --cov=box/lager --cov-append --cov-report="
          BASE="-q --import-mode=importlib -c /dev/null --timeout=60"
          rm -f .coverage
          pytest test/unit/cli/ cli/tests/          $BASE $COV
          pytest test/unit/box/                     $BASE $COV
          pytest test/unit/measurement/             $BASE $COV
          pytest test/unit/blufi/                   $BASE $COV
          pytest test/mcp/unit/                     $BASE $COV
          pytest test/unit/test_*.py test/test_*.py $BASE $COV
        shell: bash

      # Omit the test files themselves and the vendored trees: measuring how
      # well the tests cover the tests inflates the denominator by ~5000
      # statements and tells you nothing.
      - name: Report
        if: always()
        run: |
          OMIT='*/tests/*,*/test/*,*/vendor/*,*/__pycache__/*'
          {
            echo '### Coverage'
            echo
            echo 'Lowest-covered first. Reporting only -- there is no threshold.'
            echo
            echo '```'
            python -m coverage report --omit="$OMIT" --skip-covered --sort=cover | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  # Known-vulnerability scan over the resolved Python dependency tree -- the
  # counterpart of rust-checks' cargo-audit. Dependabot covers the ALERTING
  # half on GitHub's schedule; this puts the check in the PR run, so a change
  # that introduces a vulnerable resolution is red before merge, not
  # discovered after. A separate JOB, not a step in `static-checks`: it
  # depends on the PyPI advisory service, and that external flake must not
  # couple into an already-required context. Ignored IDs live in
  # tools/pip_audit_ignore.txt with reasons and owning issues (empty at
  # introduction -- the tree was clean).
  #
  # SCOPE, stated honestly: this audits the environment CI RESOLVES TODAY
  # (cli + [mcp] extra + the unit-test requirements). The box RUNTIME
  # resolves its own dependencies unpinned at image-build time and is NOT
  # covered here; that needs an audit against the box image's actual
  # resolution, tracked as follow-up work.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes anything; do not persist the token into
          # the checkout's config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install the audited environment
        run: |
          # Upgrade the env's own bootstrap tooling first: stale seeded
          # pip/setuptools carry advisories of their own, and auditing THOSE
          # tells us about the runner image, not about this project's
          # dependency tree.
          pip install --upgrade pip setuptools
          pip install -e "cli/[mcp]"
          pip install 'pytest>=9,<10' 'pytest-timeout>=2.3,<3'
          pip install -r test/requirements-unit.txt
          pip install 'pip-audit==2.10.1'
        shell: bash

      - name: pip-audit
        run: bash tools/run_pip_audit.sh
        shell: bash
